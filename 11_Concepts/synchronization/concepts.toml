rust = "[`std::hint::spin_loop`](https://doc.rust-lang.org/std/hint/fn.spin_loop.html) tells the processor it is running in a busy-wait spin loop"
cpp = "[`std::atomic_flag`](https://en.cppreference.com/w/cpp/atomic/atomic_flag) is guaranteed lock-free; its page builds a spinlock from it and warns that spinlock mutexes are extremely dubious in practice"
