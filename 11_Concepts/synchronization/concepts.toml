[[concept]]
slug = "semaphore"
title = "Semaphore"
summary = "A counter of permits: taking one waits while none are left, and returning one lets a waiter in — a lock that up to n tasks may hold at once."
aliases = ["counting semaphore", "binary semaphore"]
chapter = 4
is_a = ["synchronization"]
related = ["bounded_channel"]
pages = [["Go: A buffered channel as a semaphore", "https://masiarek.github.io/go-learning-library/06_Patterns/a_buffered_channel_as_a_semaphore/index.html"]]
notes = [["Semaphores in general - semaphore", "https://docs.google.com/document/d/1vTOfVk_ZB8ZA6WoWB9w1vR-B07Gt4y5w3JdLC7SL9RY/edit"]]
reference = [
  ["Wikipedia: Semaphore (programming)", "https://en.wikipedia.org/wiki/Semaphore_(programming)"],
  ["Allen B. Downey: The Little Book of Semaphores", "https://greenteapress.com/wp/semaphores/"],
]
[concept.languages]
rust = "None in [`std::sync`](https://doc.rust-lang.org/std/sync/index.html); [`tokio::sync::Semaphore`](https://docs.rs/tokio/latest/tokio/sync/struct.Semaphore.html) is fair, giving permits out in the order they were requested"
go = "None in `sync`: a buffered channel serves as a counting semaphore, and [`golang.org/x/sync/semaphore`](https://pkg.go.dev/golang.org/x/sync/semaphore) provides a weighted one"
c = "None in C11 [`<threads.h>`](https://en.cppreference.com/w/c/thread); POSIX `sem_t` fills the gap"
cpp = "[`std::counting_semaphore` and `std::binary_semaphore`](https://en.cppreference.com/w/cpp/thread/counting_semaphore) (C++20)"
java = "[`Semaphore`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Semaphore.html) with an optional fairness setting, which the untimed `tryAcquire` ignores"
python = "[`threading.Semaphore`](https://docs.python.org/3/library/threading.html#semaphore-objects), and `BoundedSemaphore`, which checks that it is not released too many times"
csharp = "[`SemaphoreSlim`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.semaphoreslim); blocked threads enter in no guaranteed order"
kotlin = "[`Semaphore`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.sync/-semaphore/) in kotlinx.coroutines, fair and FIFO"
os = "POSIX [`sem_wait`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sem_wait.html) and [`sem_post`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sem_post.html)"

[[concept]]
slug = "latch"
title = "Latch"
summary = "A one-shot gate: tasks wait on it until a set number of other tasks have each signalled, then every waiter proceeds and the gate stays open."
aliases = ["CountDownLatch", "std::latch", "CountdownEvent"]
chapter = 4
lessons = ["02_Shared_State/the_lost_update"]
is_a = ["synchronization"]
contrasts = ["barrier"]
notes = [["Latches - C++", "https://docs.google.com/document/d/1WpU_f2wtATL4GFhpqVgWLe5M2FxI5XXYh9vwtzRDIEY/edit?tab=t.0"]]
related = ["semaphore"]
[concept.languages]
go = "[`sync.WaitGroup`](https://pkg.go.dev/sync#WaitGroup), a counting semaphore typically used to wait for a group of goroutines to finish"
cpp = "[`std::latch`](https://en.cppreference.com/w/cpp/thread/latch) (C++20), a downward counter that threads can block on until it reaches zero"
java = "[`CountDownLatch`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CountDownLatch.html): a one-shot phenomenon, the count cannot be reset"
python = "No counted latch; [`threading.Event`](https://docs.python.org/3/library/threading.html#event-objects) is a flag that `wait` blocks on until it is set"
csharp = "[`CountdownEvent`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.countdownevent) is signaled when its count reaches zero"

[[concept]]
slug = "barrier"
title = "Barrier"
summary = "A meeting point for a fixed number of tasks: each waits there until all of them have arrived, then all continue together."
aliases = ["CyclicBarrier", "std::sync::Barrier", "rendezvous"]
chapter = 4
lessons = ["02_Shared_State/the_lost_update"]
is_a = ["synchronization"]
pages = [["Go: A buffered channel as a semaphore", "https://masiarek.github.io/go-learning-library/06_Patterns/a_buffered_channel_as_a_semaphore/index.html"]]
notes = [
  ["std::barrier - C++", "https://docs.google.com/document/u/0/d/1rZl9ENxfdmr-e77AKoAvwtFNt1Wfg5xd8glex-lWeXM/edit"],
  ["Synchronisation Patterns - C++", "https://docs.google.com/document/u/0/d/1HNxows1jQ3CjB-e8hWScZUU9bp1fUuaU0PnGnOBN6Dk/edit"],
]
[concept.languages]
rust = "[`std::sync::Barrier`](https://doc.rust-lang.org/std/sync/struct.Barrier.html) enables multiple threads to synchronize the beginning of some computation"
go = "None in `sync`; closing a channel releases every goroutine waiting to receive from it, because [after `close`](https://go.dev/ref/spec#Close) receives no longer block"
java = "[`CyclicBarrier`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CyclicBarrier.html) can be reset and reused; if one waiter is interrupted or times out, the others leave with `BrokenBarrierException`"
python = "[`threading.Barrier`](https://docs.python.org/3/library/threading.html#barrier-objects): a timeout or `abort` breaks it, and waiters get `BrokenBarrierError`"
csharp = "[`Barrier`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.barrier) is reused through several phases of an algorithm"
os = "POSIX [`pthread_barrier_wait`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_barrier_wait.html) returns `PTHREAD_BARRIER_SERIAL_THREAD` to one arbitrary thread and zero to the others"

[[concept]]
slug = "once_initialization"
title = "Run-once initialization"
summary = "Running an initializer exactly once however many threads ask for it at the same moment, and handing all of them the same result."
aliases = ["lazy initialization", "double-checked locking", "sync.Once", "OnceLock", "call_once"]
chapter = 4
is_a = ["synchronization"]
pages = [["Go: `sync.Once` runs exactly once", "https://masiarek.github.io/go-learning-library/04_Sync/once_runs_exactly_once/index.html"]]
reference = [["Wikipedia: Double-checked locking", "https://en.wikipedia.org/wiki/Double-checked_locking"]]
[concept.languages]
rust = "[`Once`](https://doc.rust-lang.org/std/sync/struct.Once.html), [`OnceLock`](https://doc.rust-lang.org/std/sync/struct.OnceLock.html), and [`LazyLock`](https://doc.rust-lang.org/std/sync/struct.LazyLock.html), a value initialized on first access that can live in a static"
go = "[`sync.Once`](https://pkg.go.dev/sync#Once) performs exactly one action; [`sync.OnceValue`](https://pkg.go.dev/sync#OnceValue) (Go 1.21) returns a function that calls `f` only once"
c = "[`call_once`](https://en.cppreference.com/w/c/thread/call_once) (C11) calls the function exactly once, even from several threads"
cpp = "[`std::call_once`](https://en.cppreference.com/w/cpp/thread/call_once), and a [static local variable](https://en.cppreference.com/w/cpp/language/storage_duration) is initialized exactly once even when threads reach it concurrently"
java = "Class initialization runs under a unique per-class initialization lock ([JLS §12.4.2](https://docs.oracle.com/javase/specs/jls/se25/html/jls-12.html#jls-12.4.2))"
python = "Not [`functools.cached_property`](https://docs.python.org/3/library/functools.html#functools.cached_property): since 3.12 it takes no lock, so synchronize the getter yourself"
csharp = "[`Lazy<T>`](https://learn.microsoft.com/en-us/dotnet/api/system.lazy-1) with `LazyThreadSafetyMode.ExecutionAndPublication`: the initialization is thread-safe, but the object it creates is not protected afterwards"
kotlin = "[`by lazy`](https://kotlinlang.org/docs/delegated-properties.html#lazy-properties) is synchronized by default: the value is computed in one thread and all threads see it"
os = "POSIX [`pthread_once`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_once.html): later calls with the same `once_control` do not call the routine again"

[[concept]]
slug = "futex"
title = "Futex"
summary = "A Linux kernel facility for building locks: the uncontended case is a single atomic operation in user space, and only a thread that has to wait enters the kernel."
aliases = ["fast user-space mutex", "WaitOnAddress"]
reference = [["Linux man page: futex(2)", "https://man7.org/linux/man-pages/man2/futex.2.html"]]
[concept.languages]
cpp = "[`std::atomic<T>::wait`](https://en.cppreference.com/w/cpp/atomic/atomic/wait) and `notify_one` (C++20) block a thread until the atomic is notified and its value has changed"
javascript = "[`Atomics.wait` and `Atomics.notify`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Atomics) are modeled on Linux futexes"
os = "Linux [futex(7)](https://man7.org/linux/man-pages/man7/futex.7.html): the uncontended case happens entirely in user space; Windows has [`WaitOnAddress`](https://learn.microsoft.com/en-us/windows/win32/api/synchapi/nf-synchapi-waitonaddress), which waits for the value at an address to change"

