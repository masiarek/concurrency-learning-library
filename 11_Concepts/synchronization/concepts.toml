chapter = 2
is_a = ["mutex"]
causes = ["starvation"]
pages = [["Rust: RwLock and atomics", "https://masiarek.github.io/rust-learning-library/09_Advanced/rwlock_and_atomics/index.html"]]
reference = [["Wikipedia: Readers–writer lock", "https://en.wikipedia.org/wiki/Readers%E2%80%93writer_lock"]]
[concept.languages]
rust = "[`RwLock`](https://doc.rust-lang.org/std/sync/struct.RwLock.html): the reader-writer priority policy is left to the operating system, and taking it again on the same thread might panic"
go = "[`sync.RWMutex`](https://pkg.go.dev/sync#RWMutex): a waiting writer blocks new readers, which rules out recursive read-locking; `RLock` cannot be upgraded to `Lock`"
cpp = "[`std::shared_mutex`](https://en.cppreference.com/w/cpp/thread/shared_mutex) (C++17): shared access for readers, exclusive for a writer"
java = "[`ReentrantReadWriteLock`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantReadWriteLock.html) with an optional fair mode; [`StampedLock`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/StampedLock.html) adds optimistic reads but is not reentrant"
csharp = "[`ReaderWriterLockSlim`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.readerwriterlockslim), which by default does not allow recursion"
os = "POSIX [`pthread_rwlock_rdlock`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_rwlock_rdlock.html): a reader gets the lock if no writer holds it and no writers are blocked on it"

[[concept]]
slug = "reentrant_lock"
title = "Reentrant lock"
summary = "A lock that the thread already holding it may take again without deadlocking itself; it is released only when every acquisition has been undone."
aliases = ["recursive mutex", "recursive lock", "RLock"]
is_a = ["mutex"]
contrasts = ["reentrancy"]
reference = [["Wikipedia: Reentrant mutex", "https://en.wikipedia.org/wiki/Reentrant_mutex"]]
[concept.languages]
rust = "[`Mutex::lock`](https://doc.rust-lang.org/std/sync/struct.Mutex.html#method.lock) is not reentrant — a second call may panic or deadlock; [`ReentrantLock`](https://doc.rust-lang.org/std/sync/struct.ReentrantLock.html) is a nightly-only experimental API"
go = "None: a [`sync.Mutex`](https://pkg.go.dev/sync#Mutex) is not tied to a goroutine, so a second `Lock` from the same goroutine blocks like any other; `RWMutex` rules out recursive read-locking too"
c = "[`mtx_init`](https://en.cppreference.com/w/c/thread/mtx_init) with `mtx_recursive`"
cpp = "[`std::recursive_mutex`](https://en.cppreference.com/w/cpp/thread/recursive_mutex)"
java = "Both locks are reentrant: [JLS §17.1](https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.1) lets a thread lock a monitor multiple times, and [`ReentrantLock`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html) allows up to 2147483647 recursive locks"
python = "[`threading.RLock`](https://docs.python.org/3/library/threading.html#rlock-objects) may be acquired multiple times by the same thread"
csharp = "[`System.Threading.Lock`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.lock) may be entered recursively and must be exited as many times"
kotlin = "[`Mutex`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.sync/-mutex/) is non-reentrant: locking it again from the coroutine that holds it suspends"
os = "POSIX [`PTHREAD_MUTEX_RECURSIVE`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutex_lock.html) keeps a lock count; a Windows [critical section](https://learn.microsoft.com/en-us/windows/win32/sync/critical-section-objects) lets its owner enter again without blocking"

[[concept]]
slug = "lock_poisoning"
title = "Lock poisoning"
summary = "Marking a lock as suspect when a thread panics while holding it, so that the next thread to take it learns the data may be half-updated."
aliases = ["poisoned mutex", "abandoned mutex"]
chapter = 3
related = ["mutex", "scoped_lock"]
pages = [
  ["Rust: Lock poisoning", "https://masiarek.github.io/rust-learning-library/09_Advanced/mutex_poisoning/index.html"],
  ["Go: A mutex guards a counter", "https://masiarek.github.io/go-learning-library/04_Sync/a_mutex_guards_a_counter/index.html"],
]
reference = [["Rust std: Mutex poisoning", "https://doc.rust-lang.org/std/sync/struct.Mutex.html#poisoning"]]
[concept.languages]
rust = "[`Mutex`](https://doc.rust-lang.org/std/sync/struct.Mutex.html#poisoning): a panic while holding the guard poisons it and later `lock` calls return an error, until `clear_poison` (Rust 1.77); [`Once`](https://doc.rust-lang.org/std/sync/struct.Once.html) is poisoned the same way"
go = "No poisoning: [`Mutex.Lock`](https://pkg.go.dev/sync#Mutex.Lock) returns no value that could report a panic"
java = "No poisoning: a [`synchronized` statement](https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.19) unlocks the monitor when its block completes abruptly for any reason"
csharp = "[`AbandonedMutexException`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.abandonedmutexexception) is thrown when a thread acquires a `Mutex` that another thread abandoned by exiting without releasing it"
os = "POSIX robust mutexes: [`pthread_mutex_lock`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutex_lock.html) returns `EOWNERDEAD` when the owner terminated while holding it, and [`pthread_mutex_consistent`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutex_consistent.html) marks the state consistent again"

[[concept]]
slug = "scoped_lock"
title = "Scoped locking"
summary = "Tying a lock's release to leaving a scope — a guard object, `defer`, `with`, `synchronized` — so that no path out of the code can forget to unlock."
