chapter = 3
uses = ["mutex"]
pages = [
  ["Rust: Forgotten unlock", "https://masiarek.github.io/rust-learning-library/31_C_and_Cpp/forgotten_unlock/index.html"],
  ["Go: A mutex guards a counter", "https://masiarek.github.io/go-learning-library/04_Sync/a_mutex_guards_a_counter/index.html"],
]
reference = [["Wikipedia: Resource acquisition is initialization", "https://en.wikipedia.org/wiki/Resource_acquisition_is_initialization"]]
prevents = ["liveness_failure"]
[concept.languages]
rust = "[`MutexGuard`](https://doc.rust-lang.org/std/sync/struct.MutexGuard.html) is an RAII scoped lock: the mutex unlocks when the guard is dropped"
go = "`defer mu.Unlock()` on the line after `Lock`: [deferred calls](https://go.dev/ref/spec#Defer_statements) run however the function returns, a panic included — but the `defer` is a line you must remember"
cpp = "[`std::lock_guard`](https://en.cppreference.com/w/cpp/thread/lock_guard) for one mutex, [`std::scoped_lock`](https://en.cppreference.com/w/cpp/thread/scoped_lock) (C++17) for several, with deadlock avoidance"
java = "[`synchronized`](https://docs.oracle.com/javase/specs/jls/se25/html/jls-14.html#jls-14.19) blocks release on any exit; a [`Lock`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/Lock.html) needs `unlock()` as the first statement of a `finally` block"
python = "`with lock:` — [`threading` primitives](https://docs.python.org/3/library/threading.html#using-locks-conditions-and-semaphores-in-the-with-statement) release when the block is exited"
csharp = "The [`lock` statement](https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/lock) expands to `try`/`finally`, or to `using (x.EnterScope())` for a `System.Threading.Lock`"
kotlin = "[`Mutex.withLock`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.sync/with-lock.html) runs a block under the lock and releases it afterwards"
javascript = "[`navigator.locks.request`](https://developer.mozilla.org/en-US/docs/Web/API/LockManager/request) releases the lock automatically when the callback returns or throws"

[[concept]]
slug = "lock_ordering"
title = "Lock ordering"
summary = "Always taking locks in one agreed order, so that no cycle of tasks waiting on each other — and so no deadlock — can form."
aliases = ["lock hierarchy"]
chapter = 3
prevents = ["deadlock"]
reference = [["Wikipedia: Dining philosophers problem", "https://en.wikipedia.org/wiki/Dining_philosophers_problem"]]
[concept.languages]
cpp = "[`std::lock`](https://en.cppreference.com/w/cpp/thread/lock) takes several mutexes with a deadlock avoidance algorithm instead of a fixed order"
java = "[JLS §17.1](https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.1) tells programs holding locks on multiple objects to use conventional deadlock-avoidance techniques"
os = "Linux [lockdep](https://docs.kernel.org/locking/lockdep-design.html) records which lock is taken while holding which, and reports orders that could form a cycle"
other = "Valgrind's [Helgrind](https://valgrind.org/docs/manual/hg-manual.html) monitors the order threads acquire locks in to find potential deadlocks; [ThreadSanitizer](https://clang.llvm.org/docs/ThreadSanitizer.html) reports lock-order inversions (`detect_deadlocks`)"

