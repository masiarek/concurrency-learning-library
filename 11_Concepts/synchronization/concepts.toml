[concept.languages]
rust = "No monitor type: a [`Mutex<T>`](https://doc.rust-lang.org/std/sync/struct.Mutex.html) holds the data and a [`Condvar`](https://doc.rust-lang.org/std/sync/struct.Condvar.html) waits on its guard"
