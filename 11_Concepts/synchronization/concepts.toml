csharp = "The body of a [`lock` statement](https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/lock), released even if an exception is thrown"
os = "Windows names an object after it: [critical section objects](https://learn.microsoft.com/en-us/windows/win32/sync/critical-section-objects) work like a mutex for the threads of one process"

[[concept]]
slug = "mutual_exclusion"
title = "Mutual exclusion"
