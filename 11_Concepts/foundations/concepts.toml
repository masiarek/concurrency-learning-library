  ["async - general - asynchronous programming", "https://docs.google.com/document/d/1P9HhzF0eb_Zo4EGP_4V7ESXQd4VoBBypnxHN4jOXHNA/edit?tab=t.0"],
  ["What is Async Programming and why would you do it", "https://docs.google.com/document/d/1W3Jd69czmRZj2Rc8e5kfWZlnuGK_CPCLEMugE5zFN5A/edit?tab=t.0"],
  ["synchronous vs asynchronous - general", "https://docs.google.com/document/d/1higzhaQYEb1GjKD2LzfNmbJa8n3Zb8TU0hT4Vt-tY3M/edit?tab=t.0"],
  ["why async", "https://docs.google.com/document/u/0/d/14WnFVjc_4uIx_qvYCcuxbd0I1dswxPmDizEGOllAv-4/edit"],
]
reference = [
  ["Wikipedia: Asynchrony (computer programming)", "https://en.wikipedia.org/wiki/Asynchrony_(computer_programming)"],
  ["Asynchronous Programming in Rust: what is async programming", "https://rust-lang.github.io/async-book/"],
]
[concept.languages]
rust = "An [`async`](https://doc.rust-lang.org/std/keyword.async.html) function returns a [`Future`](https://doc.rust-lang.org/std/future/trait.Future.html), which does nothing until something polls it"
go = "No `async` or `await`: code is written blocking, and when a goroutine blocks, the runtime [moves the others to another thread](https://go.dev/doc/faq#goroutines)"
c = "POSIX [`aio_read`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/aio_read.html) and its relatives"
cpp = "[`std::async`](https://en.cppreference.com/w/cpp/thread/async) returns a `std::future`; C++20 [coroutines](https://en.cppreference.com/w/cpp/language/coroutines) add `co_await`"
java = "[`CompletableFuture`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html) chains stages that run when a result arrives"
python = "[`asyncio`](https://docs.python.org/3/library/asyncio.html) with `async def` and `await`"
csharp = "[`async` and `await`](https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/) over `Task` and `Task<T>`"
javascript = "[Promises](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise) and [`async` functions](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function)"
kotlin = "Calls to [`suspend` functions](https://kotlinlang.org/docs/composing-suspending-functions.html) run sequentially by default; the library function [`async`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/async.html) starts one concurrently and returns a `Deferred`"
swift = "[`async` functions and `await`](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/)"
elixir_erlang = "[`Task.async`](https://hexdocs.pm/elixir/Task.html#async/1) and `Task.await`: a process and a message underneath"
haskell = "[`async` and `wait`](https://hackage.haskell.org/package/async/docs/Control-Concurrent-Async.html) from the `async` package run an `IO` action in a separate thread and collect its result"
os = "[`io_uring`](https://man7.org/linux/man-pages/man7/io_uring.7.html) on Linux, with a submission queue and a completion queue; the [POSIX AIO](https://man7.org/linux/man-pages/man7/aio.7.html) interface"

[[concept]]
slug = "sequential_execution"
title = "Sequential execution"
summary = "Steps run one after another in a fixed order, each finishing before the next starts: a single total order of events, and the baseline every concurrent program is measured against."
aliases = ["serial execution", "sequential programming"]
notes = [
  ["sequential programming - sequential functions - sequential platform", "https://docs.google.com/document/d/1Ru7dKMOBWpFx36MzGhzMOWZhZ4WYb7Kb0Tkqv9VAMfE/edit?tab=t.0"],
  ["Sequential Steps", "https://docs.google.com/document/d/1jXqqDFIZQAiQ_0s1hUHe8_X7HiZ2UQeySHO8bVuK8Xs/edit?tab=t.0"],
]
reference = [["Dominik Tornow: Distributed Async Await (NDC talk)", "https://www.youtube.com/watch?v=lfSIunYUsSg"]]

[[concept]]
slug = "blocking_and_nonblocking"
title = "Blocking and non-blocking calls"
summary = "A blocking call does not return until its work is done, holding the caller's thread the whole time; a non-blocking call returns at once and reports that the work is not ready yet or will finish later."
aliases = ["synchronous and asynchronous calls", "blocking I/O", "non-blocking I/O"]
chapter = 6
related = ["io_bound_and_cpu_bound", "polling"]
notes = [
  ["non-blocking paradigms - general - nonblocking", "https://docs.google.com/document/d/13kt39FBd2i3HqEEjlgEcZg4KDG8mkR4Dc6XSVsP9WRY/edit?tab=t.0"],
  ["blocked synchronously - general", "https://docs.google.com/document/d/11tECUJ_valZsugbPQQAtQZSi5Je_lGih2rx-RYc7PSg/edit?tab=t.0"],
  ["Synchronous blocking vs nonblocking model", "https://docs.google.com/document/d/1frCynKXngtPaneaZ2Kt42hxWvV36gBoEy_kL3HkZFn4/edit?tab=t.0"],
  ["Asynchronous blocking vs nonblocking model", "https://docs.google.com/document/d/1XtbeBZlmovmbd8JDhDpGPyz2alLl0Jm3Uc4RUVildEQ/edit?tab=t.0"],
  ["Blocking vs. non-blocking code - rust", "https://docs.google.com/document/u/0/d/16_DxN3at4af-2FQFy--4b8TtdQs5OLicJLJNWYRjHyQ/edit"],
  ["blocking - thread - general", "https://docs.google.com/document/u/0/d/1rrnzJmAZvLCezYnxTj-QriOADeDaAHnmsd03y1t1gMU/edit"],
]
reference = [["Wikipedia: Asynchronous I/O", "https://en.wikipedia.org/wiki/Asynchronous_I/O"]]
[concept.languages]
rust = "[`TcpStream::set_nonblocking`](https://doc.rust-lang.org/std/net/struct.TcpStream.html#method.set_nonblocking) makes a read that would wait return an `io::ErrorKind::WouldBlock` error instead"
go = "A send or receive on an [unbuffered channel](https://go.dev/ref/spec#Channel_types) blocks until the other side is ready"
c = "With `O_NONBLOCK` set, [`read`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/read.html) fails with `EAGAIN` instead of waiting"
java = "[`SelectableChannel.configureBlocking(false)`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/channels/SelectableChannel.html#configureBlocking%28boolean%29) puts an NIO channel in non-blocking mode"
python = "[`socket.setblocking(False)`](https://docs.python.org/3/library/socket.html#socket.socket.setblocking); in `asyncio`, [`asyncio.to_thread`](https://docs.python.org/3/library/asyncio-task.html#asyncio.to_thread) runs a blocking function that would otherwise block the event loop"
csharp = "[Asynchronous file I/O](https://learn.microsoft.com/en-us/dotnet/standard/io/asynchronous-file-i-o) methods such as `ReadAsync` do the work without blocking the main thread"
javascript = "[`Atomics.wait`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Atomics/wait) blocks, and so cannot be used in the main thread"
os = "The `O_NONBLOCK` flag of [`open(2)`](https://man7.org/linux/man-pages/man2/open.2.html); readiness is then waited for with `poll` or `epoll`"

[[concept]]
slug = "io_bound_and_cpu_bound"
title = "I/O-bound and CPU-bound work"
summary = "Work that spends its time waiting for disks and networks gains from concurrency even on one core; work that spends its time computing gains only from parallelism."
aliases = ["I/O-bound", "CPU-bound"]
chapter = 7
notes = [
  ["CPU-Bound Tasks", "https://docs.google.com/document/d/1xw8T95umBjyeuxNkw4LM-WU_igooayxL6Ip-Cgu0yBk/edit?tab=t.0"],
  ["I/O-bound tasks", "https://docs.google.com/document/u/0/d/1jgLIEhaiavVwamvco5Sr0R-Diim7LY3TrclyFXmESZE/edit"],
  ["I/O bottlenecks - general", "https://docs.google.com/document/d/1RjYTibpNuLPzaR3ZiL0_sPr2e3hVsLTAUqmfZ_jCmgI/edit?tab=t.0"],
]
reference = [
  ["Wikipedia: CPU-bound", "https://en.wikipedia.org/wiki/CPU-bound"],
  ["Wikipedia: I/O bound", "https://en.wikipedia.org/wiki/I/O_bound"],
]
[concept.languages]
rust = "[`tokio::task::spawn_blocking`](https://docs.rs/tokio/latest/tokio/task/fn.spawn_blocking.html) moves blocking work off the async worker threads"
java = "[Virtual threads](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#virtual-threads) suit tasks that spend most of their time blocked on I/O, not long CPU-intensive work"
python = "The [`threading`](https://docs.python.org/3/library/threading.html) docs advise `multiprocessing` or `ProcessPoolExecutor` for CPU-bound work, and threads for I/O-bound tasks, because of the GIL"
csharp = "[Asynchronous programming scenarios](https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/async-scenarios) separates I/O-bound work (`await` the I/O call) from CPU-bound work (`await Task.Run`)"
kotlin = "[`Dispatchers.IO`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/-dispatchers/-i-o.html) is for offloading blocking I/O; [`Dispatchers.Default`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/-dispatchers/-default.html) uses at most one thread per CPU core (at least two)"
elixir_erlang = "A native function that cannot finish within a millisecond is marked dirty and runs on [dirty CPU or dirty I/O schedulers](https://www.erlang.org/doc/apps/erts/erl_nif.html#dirty_nifs), apart from the ordinary ones"

[[concept]]
