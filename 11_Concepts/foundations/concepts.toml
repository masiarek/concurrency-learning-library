[[concept]]
slug = "speedup_and_amdahls_law"
title = "Speedup and Amdahl's law"
summary = "How much faster more processors make a program is capped by the part that must still run sequentially: if a tenth of the work is serial, no number of cores gives more than ten times the speed."
aliases = ["Amdahl's law", "Gustafson's law", "speedup"]
chapter = 7
related = ["granularity"]
reference = [["Wikipedia: Amdahl's law", "https://en.wikipedia.org/wiki/Amdahl%27s_law"]]

[[concept]]
slug = "granularity"
title = "Granularity"
summary = "How big the pieces of work handed to separate tasks are: too coarse leaves cores idle, too fine spends more on coordinating the pieces than on the work in them."
aliases = ["task granularity", "coarse-grained", "fine-grained"]
chapter = 7
related = ["oversubscription"]
notes = [["granularity - async", "https://docs.google.com/document/d/1maQmN7P6048Px5MIhHitgYvO3M688VMIJkIZkifuS14/edit?tab=t.0"]]
reference = [["Wikipedia: Granularity (parallel computing)", "https://en.wikipedia.org/wiki/Granularity_(parallel_computing)"]]
[concept.languages]
rust = "Rayon's [`with_min_len`](https://docs.rs/rayon/latest/rayon/iter/trait.IndexedParallelIterator.html#method.with_min_len) stops a parallel iterator splitting below a given length"
java = "[`ForkJoinTask`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ForkJoinTask.html) gives a rule of thumb: a task should perform more than 100 and less than 10000 basic computational steps"
python = "[`Executor.map`](https://docs.python.org/3/library/concurrent.futures.html#concurrent.futures.Executor.map) with `ProcessPoolExecutor` takes a `chunksize`; a larger one can greatly speed up long iterables"
csharp = "[Custom partitioners](https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/custom-partitioners-for-plinq-and-tpl) group loop iterations into ranges when each one does little work"

[[concept]]
slug = "oversubscription"
title = "Oversubscription"
summary = "More busy threads than there are cores, so the machine spends its time switching between them instead of running them."
causes = ["contention"]
related = ["thread_pool", "context_switch"]
notes = [["oversubscription", "https://docs.google.com/document/d/1LjySDlE4JbkjDYmGxU3WjZC73oABCtMp2B4oiyNw8yk/edit?tab=t.0"]]
[concept.languages]
rust = "[`available_parallelism`](https://doc.rust-lang.org/std/thread/fn.available_parallelism.html) estimates how many threads a program should use"
go = "[`runtime.GOMAXPROCS`](https://pkg.go.dev/runtime#GOMAXPROCS) caps how many CPUs execute Go code simultaneously, however many goroutines there are"
cpp = "[`std::thread::hardware_concurrency`](https://en.cppreference.com/w/cpp/thread/thread/hardware_concurrency) is only a hint, and may be 0"
python = "[`os.process_cpu_count`](https://docs.python.org/3/library/os.html#os.process_cpu_count) (3.13) counts the logical CPUs the calling thread may use, and [`ThreadPoolExecutor`](https://docs.python.org/3/library/concurrent.futures.html#threadpoolexecutor) sizes its default pool from it"
