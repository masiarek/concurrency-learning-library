[category]
title = "Foundations"
order = 1
blurb = "What the words mean before any language gets involved: several tasks over the same period of time, several computations at the same instant, and not waiting for an answer."

[[concept]]
slug = "concurrency"
title = "Concurrency"
summary = "Structuring a program as tasks whose lifetimes overlap, so that all of them make progress over the same period of time — interleaved on one core, or at the same instant on several."
aliases = ["concurrent programming", "concurrent computing"]
chapter = 1
contrasts = ["parallelism", "asynchrony", "sequential_execution"]
related = ["interleaving", "multitasking", "concurrency_models"]
lessons = ["01_Threads/who_waits_when_main_returns"]
notes = [
  ["Concurrency - concurrent operations", "https://docs.google.com/document/u/0/d/1lPhK8MVCged6d1Px-_N5G4nOME2CfzNzCBHen57IOwo/edit"],
  ["concurrently - rust - main - concurrency", "https://docs.google.com/document/u/0/d/12nR_hllHkXX0vWYWOvoNvbLVY3cbty0QKf4wSicRKAA/edit"],
  ["Concurrency vs Parallelism - concurrent vs parallel execution", "https://docs.google.com/document/d/1BFnxp56E09aqwSpSYWKTMkb63gPlIglbyHnUYkAYbzc/edit?tab=t.0"],
  ["Asynchronous - Concurrency - Parallelism - general concept", "https://docs.google.com/document/d/1lvCfQEo4bjqyU6-F2igHXelkE-1mnbptyNGhsjysZw0/edit?tab=t.0"],
  ["async vs concurrent", "https://docs.google.com/document/u/0/d/19By5TJ-j-V0oJm4vnUtb51ZKgQOUJmwJT6v3ACYOBPk/edit"],
  ["Index - Concurrency and Parallelism in general - main", "https://docs.google.com/document/u/0/d/1Nk5uXl3VEjYrkKRMuO_CBtcB0vN2mKLNKh1z5SU9UIA/edit"],
]
reference = [["Wikipedia: Concurrent computing", "https://en.wikipedia.org/wiki/Concurrent_computing"]]
[concept.languages]
rust = "The book's [Fearless Concurrency](https://doc.rust-lang.org/book/ch16-00-concurrency.html) chapter: threads, message passing and shared state, with ownership and type checking turning many concurrency errors into compile-time errors"
go = "In the language: the [`go` statement](https://go.dev/ref/spec#Go_statements) starts a goroutine, and [channels](https://go.dev/ref/spec#Channel_types) and [`select`](https://go.dev/ref/spec#Select_statements) connect goroutines"
c = "C11's [`<threads.h>`](https://en.cppreference.com/w/c/thread) is optional (a compiler may define `__STDC_NO_THREADS__`); POSIX threads start with [`pthread_create`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_create.html)"
cpp = "The [concurrency support library](https://en.cppreference.com/w/cpp/thread) since C++11: threads, mutexes, condition variables and futures, with `std::jthread` added in C++20"
java = "[`Thread`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html) since 1.0, and the executors, locks and concurrent collections of [`java.util.concurrent`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/package-summary.html)"
python = "The library's [Concurrent Execution](https://docs.python.org/3/library/concurrency.html) chapter (`threading`, `multiprocessing`, `concurrent.futures`), and [`asyncio`](https://docs.python.org/3/library/asyncio.html) for `async`/`await` code"
csharp = "[Task-based asynchronous programming](https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming) with `Task`, over [managed threads](https://learn.microsoft.com/en-us/dotnet/standard/threading/managed-threading-basics)"
javascript = "Each agent, analogous to a thread, runs an [event loop](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Execution_model): concurrency comes from promises and `async` functions, parallelism from [workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API)"
kotlin = "[Coroutines](https://kotlinlang.org/docs/coroutines-overview.html): the language has `suspend`, and `async`, `launch` and the rest come from the `kotlinx.coroutines` library"
swift = "In the language: [`async`/`await`, tasks and actors](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/)"
elixir_erlang = "Lightweight [processes](https://www.erlang.org/doc/system/ref_man_processes.html), fast to create and terminate, that communicate by sending messages"
haskell = "[`forkIO`](https://hackage.haskell.org/package/base/docs/Control-Concurrent.html#v:forkIO) threads scheduled by the GHC runtime, communicating through `MVar`s"

[[concept]]
slug = "parallelism"
title = "Parallelism"
summary = "Running several computations at the same instant on separate processing units so the whole finishes sooner; it needs more than one core, and concurrency does not."
aliases = ["parallel computing", "parallel execution"]
chapter = 7
related = ["speedup_and_amdahls_law", "io_bound_and_cpu_bound"]
notes = [
  ["parallelism - general", "https://docs.google.com/document/d/1VvV-E2KRjEpYtHoTCS1bRh89V1XSUJmzU6wpCpClU6M/edit?tab=t.0"],
  ["parallelism - rust", "https://docs.google.com/document/u/0/d/1l4c6dy7ZB7PUp83hxH7Vnsr5_qX5JkrRES5aUhvuXXs/edit"],
]
reference = [["Wikipedia: Parallel computing", "https://en.wikipedia.org/wiki/Parallel_computing"]]
[concept.languages]
rust = "[`std::thread::scope`](https://doc.rust-lang.org/std/thread/fn.scope.html) runs threads that borrow local data; parallel iterators come from the [Rayon](https://docs.rs/rayon/latest/rayon/) crate, not the standard library"
go = "Goroutines run in parallel on as many CPUs as [`runtime.GOMAXPROCS`](https://pkg.go.dev/runtime#GOMAXPROCS) allows"
cpp = "[Execution policies](https://en.cppreference.com/w/cpp/algorithm/execution_policy_tag_t) (C++17) let standard algorithms such as `std::sort` and `std::reduce` run in parallel"
java = "[Parallel streams](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/package-summary.html#Parallelism), and [`ForkJoinPool`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ForkJoinPool.html) for tasks that spawn subtasks"
python = "Threads do not run Python code in parallel under the [GIL](https://docs.python.org/3/glossary.html#term-global-interpreter-lock); use [`multiprocessing`](https://docs.python.org/3/library/multiprocessing.html) or the free-threaded build"
csharp = "[Parallel programming in .NET](https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/): the Task Parallel Library and PLINQ"
javascript = "Each [worker](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API) runs in a background thread; memory is shared between them with a [`SharedArrayBuffer`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/SharedArrayBuffer)"
elixir_erlang = "The VM starts one [scheduler thread](https://www.erlang.org/doc/apps/erts/erl_cmd.html) per logical processor by default, so processes run in parallel without any change to the code"
haskell = "[`par` and `pseq`](https://hackage.haskell.org/package/parallel/docs/Control-Parallel.html) in the `parallel` package mark pure expressions that may be worth evaluating in parallel"

[[concept]]
slug = "asynchrony"
title = "Asynchrony"
summary = "Starting an operation and carrying on with other work instead of waiting for it; the result arrives later, through a callback, a future, or an await."
