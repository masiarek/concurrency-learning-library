# Abbreviations for 11_Concepts/abbreviations/README.md. Every entry needs a source.
# An abbreviation with no findable source is left out rather than guessed at.

[[abbreviation]]
abbr = "ABA"
expansion = "the A → B → A sequence of values behind the ABA problem (not an acronym)"
concept = "aba_problem"
source = "https://en.wikipedia.org/wiki/ABA_problem"

[[abbreviation]]
abbr = "ACID"
expansion = "atomicity, consistency, isolation, durability — the guarantees of a database transaction"
concept = "consistency_models"
source = "https://en.wikipedia.org/wiki/ACID"

[[abbreviation]]
abbr = "BASE"
expansion = "basically available, soft state, eventually consistent — the usual contrast with ACID"
concept = "consistency_models"
source = "https://en.wikipedia.org/wiki/Eventual_consistency"

[[abbreviation]]
abbr = "CAS"
expansion = "compare-and-swap"
concept = "compare_and_swap"
source = "https://en.wikipedia.org/wiki/Compare-and-swap"

[[abbreviation]]
abbr = "CSP"
expansion = "communicating sequential processes"
concept = "csp"
source = "https://en.wikipedia.org/wiki/Communicating_sequential_processes"

[[abbreviation]]
abbr = "EDF"
expansion = "earliest deadline first"
concept = "earliest_deadline_first"
source = "https://en.wikipedia.org/wiki/Earliest_deadline_first_scheduling"

[[abbreviation]]
abbr = "FIFO"
expansion = "first in, first out — the order a channel or queue delivers in"
concept = "channel"
source = "https://en.wikipedia.org/wiki/FIFO_(computing_and_electronics)"

[[abbreviation]]
abbr = "futex"
expansion = "fast user-space mutex"
concept = "futex"
source = "https://man7.org/linux/man-pages/man2/futex.2.html"

[[abbreviation]]
abbr = "GCD"
expansion = "Grand Central Dispatch, Apple's task-queue concurrency library"
