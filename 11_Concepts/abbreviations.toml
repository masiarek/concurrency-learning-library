[[abbreviation]]
abbr = "GPGPU"
expansion = "general-purpose computing on graphics processing units"
concept = "gpu_computing"
source = "https://en.wikipedia.org/wiki/General-purpose_computing_on_graphics_processing_units"

[[abbreviation]]
abbr = "IOCP"
expansion = "I/O completion port, Windows' mechanism for asynchronous I/O"
