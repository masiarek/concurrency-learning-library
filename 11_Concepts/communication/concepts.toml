  ["channel", "https://docs.google.com/document/u/0/d/1ZlGpxYxS0Dp1KLNzUDe2YSbVAU-l3GPFgX9y4cPIS9o/edit"],
  ["Channels - rust", "https://docs.google.com/document/d/1CQBXxKYGBJZMInRx6Ahve8Gzp4C4r0mSL9wngjorf9M/edit?tab=t.0"],
  ["async-compatible nonblocking channels", "https://docs.google.com/document/u/0/d/1xU0J0ZvRMFv9MlCsy4cR_Jt-k4O3UKZnjDPrbJnewo0/edit"],
  ["crossbeam", "https://docs.google.com/document/d/1MsXBn3QXmFkV6KuBtv9AUhocfxctyXbfp0TI534Mf6c/edit?tab=t.0"],
]
reference = [["Wikipedia: Channel (programming)", "https://en.wikipedia.org/wiki/Channel_(programming)"]]
[concept.languages]
rust = "[`mpsc::channel`](https://doc.rust-lang.org/std/sync/mpsc/fn.channel.html) or the bounded [`sync_channel`](https://doc.rust-lang.org/std/sync/mpsc/fn.sync_channel.html); there is no `close`: operations fail once the other half has hung up by being dropped ([module docs](https://doc.rust-lang.org/std/sync/mpsc/index.html))"
go = "a [`chan T`](https://go.dev/ref/spec#Channel_types) made with `make` and closed explicitly with [`close`](https://go.dev/ref/spec#Close); a nil channel is never ready"
java = "[`BlockingQueue`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/BlockingQueue.html) with `put` and `take`; it has no close or shutdown operation, so producers signal the end with a poison object"
python = "[`queue.Queue`](https://docs.python.org/3/library/queue.html#queue.Queue) for threads and [`asyncio.Queue`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue), which is not thread-safe, for coroutines"
csharp = "[`Channel<T>`](https://learn.microsoft.com/en-us/dotnet/core/extensions/channels), split into a `ChannelWriter` and a `ChannelReader`; `writer.Complete()` ends it"
kotlin = "[`Channel`](https://kotlinlang.org/docs/channels.html): `send` and `receive` suspend rather than block, and unlike a queue a channel can be closed"
elixir_erlang = "no channel objects: a message is sent to a process and stored in its [mailbox](https://hexdocs.pm/elixir/processes.html)"
haskell = "[`Chan`](https://hackage.haskell.org/package/base/docs/Control-Concurrent-Chan.html), unbounded"
other = "Clojure's [core.async](https://clojure.github.io/core.async/) channels, made with `chan`"

[[concept]]
slug = "unbuffered_channel"
title = "Unbuffered channel"
summary = "A channel with no buffer: a send waits until a receiver takes the value, so every message is also a meeting of the two tasks."
aliases = ["synchronous channel", "rendezvous channel", "synchronized channel"]
chapter = 5
is_a = ["channel"]
contrasts = ["bounded_channel"]
pages = [["Go: An unbuffered send waits for a receiver", "https://masiarek.github.io/go-learning-library/02_Channels/an_unbuffered_send_waits_for_a_receiver/index.html"]]
notes = [["synchronized channels - general", "https://docs.google.com/document/u/0/d/1CKoMXDBi8dCU-4ExIDJhjAnIuNn3lE2TacsKim8Tnp8/edit"]]
[concept.languages]
rust = "[`sync_channel(0)`](https://doc.rust-lang.org/std/sync/mpsc/fn.sync_channel.html), a rendezvous channel: each send does not return until a receive is paired with it"
go = "[`make(chan T)`](https://go.dev/ref/spec#Channel_types): with the capacity zero or absent, communication succeeds only when sender and receiver are both ready"
java = "[`SynchronousQueue`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/SynchronousQueue.html): every insert waits for a remove, the queue has no capacity at all, and its docs compare it to the rendezvous channels of CSP"
python = "no rendezvous queue: `maxsize=0` makes a [`queue.Queue`](https://docs.python.org/3/library/queue.html#queue.Queue) infinite, not unbuffered"
kotlin = "[`Channel.RENDEZVOUS`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.channels/-channel/) (capacity 0): no buffer, so `send` suspends until a `receive` arrives, and vice versa"
elixir_erlang = "none: [signals between processes are asynchronous](https://www.erlang.org/doc/system/ref_man_processes.html); a synchronous request is built on top, as [`GenServer.call`](https://hexdocs.pm/elixir/GenServer.html) does by waiting for the reply"

[[concept]]
slug = "bounded_channel"
title = "Buffered and bounded channels"
summary = "A channel with a fixed-size buffer: sends succeed until it is full and then wait, which is how a slow receiver pushes back on a fast sender; an unbounded channel never waits and never pushes back."
aliases = ["buffered channel", "bounded queue", "unbounded channel", "asynchronous channel"]
chapter = 5
is_a = ["channel"]
pages = [["Go: A buffered channel is a bounded queue", "https://masiarek.github.io/go-learning-library/02_Channels/a_buffered_channel_is_a_bounded_queue/index.html"]]
[concept.languages]
rust = "[`sync_channel(n)`](https://doc.rust-lang.org/std/sync/mpsc/fn.sync_channel.html) blocks senders when full, while [`channel()`](https://doc.rust-lang.org/std/sync/mpsc/fn.channel.html) has an infinite buffer and never blocks the sender; tokio's [`mpsc`](https://docs.rs/tokio/latest/tokio/sync/mpsc/index.html) offers both for async tasks"
go = "[`make(chan T, n)`](https://go.dev/ref/spec#Channel_types): a send proceeds without blocking while the buffer is not full"
java = "[`ArrayBlockingQueue`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ArrayBlockingQueue.html), a classic bounded buffer; [`LinkedBlockingQueue`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/LinkedBlockingQueue.html) is optionally bounded"
python = "[`queue.Queue(maxsize)`](https://docs.python.org/3/library/queue.html#queue.Queue) and [`asyncio.Queue(maxsize)`](https://docs.python.org/3/library/asyncio-queue.html#asyncio.Queue); a `maxsize` of zero or less means infinite"
csharp = "[`Channel.CreateBounded`](https://learn.microsoft.com/en-us/dotnet/core/extensions/channels) or `CreateUnbounded`; a [`BoundedChannelFullMode`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.channels.boundedchannelfullmode) says whether a full channel waits, or drops the newest, the oldest or the item being written"
kotlin = "a capacity passed to [`Channel`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.channels/-channel/), or `Channel.UNLIMITED`; [`BufferOverflow`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.channels/-buffer-overflow/) chooses between suspending the sender and dropping a value"
os = "a [pipe](https://man7.org/linux/man-pages/man7/pipe.7.html) has a limited capacity, 16 pages by default on Linux: a write to a full pipe blocks, or fails if the pipe is non-blocking"

[[concept]]
slug = "select"
title = "Select"
summary = "Waiting on several channel operations or futures at once, and continuing with whichever becomes ready first."
aliases = ["select!", "race"]
chapter = 5
uses = ["channel"]
related = ["timeout", "cancellation"]
pages = [
  ["Go: `select` waits on many channels", "https://masiarek.github.io/go-learning-library/03_Select/select_waits_on_many/index.html"],
  ["Go: `select` chooses at random", "https://masiarek.github.io/go-learning-library/03_Select/select_chooses_at_random/index.html"],
  ["Go: A nil channel disables a case", "https://masiarek.github.io/go-learning-library/03_Select/a_nil_channel_disables_a_case/index.html"],
]
[concept.languages]
rust = "none in std; crossbeam's [`select!`](https://docs.rs/crossbeam/latest/crossbeam/channel/macro.select.html) runs a random one of the ready channel operations, and tokio's [`select!`](https://docs.rs/tokio/latest/tokio/macro.select.html) returns when the first branch completes and cancels the rest"
go = "the [`select`](https://go.dev/ref/spec#Select_statements) statement: when several cases can proceed, one is chosen by uniform pseudo-random selection; a `default` case makes it non-blocking"
c = "[`select`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/select.html) and [`poll`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/poll.html) wait on file descriptors, not on in-memory channels"
java = "[`CompletableFuture.anyOf`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html) completes when any of the given futures does; NIO's [`Selector`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/nio/channels/Selector.html) multiplexes selectable I/O channels"
python = "[`asyncio.wait`](https://docs.python.org/3/library/asyncio-task.html#asyncio.wait) with `return_when=FIRST_COMPLETED` returns the done and pending sets as soon as any awaitable finishes"
csharp = "[`Task.WhenAny`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.whenany) completes when any of the supplied tasks has completed"
javascript = "[`Promise.race`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/race) settles with the eventual state of the first promise to settle"
kotlin = "the experimental [`select`](https://kotlinlang.org/docs/select-expression.html) expression, which is biased to the first clause when several are ready, unlike Go's random choice"
elixir_erlang = "[`receive`](https://www.erlang.org/doc/system/expressions.html) takes the first message in the queue that matches any clause, with an optional `after` timeout"
os = "[epoll](https://man7.org/linux/man-pages/man7/epoll.7.html), like `select` and `poll`, monitors many file descriptors to see which can do I/O"
other = "Clojure core.async's [`alts!`](https://clojure.github.io/core.async/)"

[[concept]]
slug = "backpressure"
title = "Backpressure"
summary = "Letting a slow consumer slow its producers down — by making sends wait or fail — instead of letting unprocessed work pile up without limit."
aliases = ["flow control"]
chapter = 5
uses = ["bounded_channel"]
pages = [
  ["Go: A buffered channel is a bounded queue", "https://masiarek.github.io/go-learning-library/02_Channels/a_buffered_channel_is_a_bounded_queue/index.html"],
  ["Rust: Backpressure", "https://masiarek.github.io/rust-learning-library/35_Async/building_minidb/backpressure/index.html"],
]
[concept.languages]
rust = "a bounded [`sync_channel`](https://doc.rust-lang.org/std/sync/mpsc/fn.sync_channel.html): `send` blocks until the buffer has room"
go = "a buffered channel: a send proceeds without blocking only while the buffer is not full ([spec](https://go.dev/ref/spec#Channel_types))"
java = "[`Flow`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Flow.html), the reactive-streams interfaces: a subscriber asks for items with `request(n)`, a simple form of flow control"
python = "[`StreamWriter.drain`](https://docs.python.org/3/library/asyncio-stream.html#asyncio.StreamWriter.drain): once the write buffer reaches the high watermark, it blocks until the buffer drains to the low watermark"
csharp = "[`BoundedChannelFullMode.Wait`](https://learn.microsoft.com/en-us/dotnet/core/extensions/channels), the default for a bounded channel: `WriteAsync` waits for space"
javascript = "[streams](https://developer.mozilla.org/en-US/docs/Web/API/Streams_API/Concepts#backpressure) compare their queue with a high water mark and report `desiredSize`; in Node, `write()` returns `false` until a `'drain'` event ([guide](https://nodejs.org/en/learn/modules/backpressuring-in-streams))"
kotlin = "[`BufferOverflow.SUSPEND`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines.channels/-buffer-overflow/): the sender suspends while the buffer is full"
os = "a full [pipe](https://man7.org/linux/man-pages/man7/pipe.7.html) blocks the writing process until enough has been read to make room"

