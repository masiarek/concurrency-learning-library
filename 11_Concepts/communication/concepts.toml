chapter = 5
is_a = ["message_passing"]
notes = [["Broker - Asynchronous - in general", "https://docs.google.com/document/u/0/d/1F1NMuTJYTemiALyBsQn6NMQ8ZN9mJvPyUUdCZ0x22e0/edit"]]
