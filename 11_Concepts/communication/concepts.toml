  ["Rust: Channels", "https://masiarek.github.io/rust-learning-library/09_Advanced/channels/index.html"],
  ["Go: An unbuffered send waits for a receiver", "https://masiarek.github.io/go-learning-library/02_Channels/an_unbuffered_send_waits_for_a_receiver/index.html"],
  ["Go: Closing a channel ends a range", "https://masiarek.github.io/go-learning-library/02_Channels/closing_a_channel_ends_a_range/index.html"],
]
