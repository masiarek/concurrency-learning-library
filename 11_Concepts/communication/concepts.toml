[category]
title = "Communication"
order = 7
blurb = "Tasks that hand data to each other instead of sharing it — channels, queues, actors, processes — and the patterns built from them."

[[concept]]
slug = "message_passing"
title = "Message passing"
summary = "Tasks share nothing and interact only by sending each other values, so that each value has one owner at a time."
chapter = 5
lessons = ["02_Shared_State/keeping_every_update"]
alternative = ["shared_memory"]
notes = [["Broker - sender - receiver - in general", "https://docs.google.com/document/d/1F1NMuTJYTemiALyBsQn6NMQ8ZN9mJvPyUUdCZ0x22e0/edit"]]
reference = [["Wikipedia: Message passing", "https://en.wikipedia.org/wiki/Message_passing"]]
[concept.languages]
rust = "channels from [`std::sync::mpsc`](https://doc.rust-lang.org/std/sync/mpsc/index.html), multi-producer and single-consumer: `Sender`s can be cloned, the `Receiver` cannot"
go = "goroutines and [channels](https://go.dev/ref/spec#Channel_types); [Effective Go](https://go.dev/doc/effective_go#sharing) puts it as share memory by communicating, instead of communicating by sharing memory"
java = "no channel type: threads hand objects over through a [`BlockingQueue`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/BlockingQueue.html), designed primarily for producer-consumer queues"
python = "[`queue.Queue`](https://docs.python.org/3/library/queue.html#queue.Queue) between threads; between processes, [`multiprocessing`](https://docs.python.org/3/library/multiprocessing.html#pipes-and-queues) pipes and queues, whose queues serialize every object put into them"
csharp = "[`System.Threading.Channels`](https://learn.microsoft.com/en-us/dotnet/core/extensions/channels), for passing data between producers and consumers asynchronously"
javascript = "a worker gets data through [`postMessage`](https://developer.mozilla.org/en-US/docs/Web/API/Worker/postMessage), which copies it with the structured clone algorithm or transfers it"
kotlin = "[`Channel`](https://kotlinlang.org/docs/channels.html), conceptually a `BlockingQueue` whose `send` and `receive` suspend instead of blocking"
elixir_erlang = "the whole model: a process sends to another with `!` (Erlang) or `send/2` (Elixir), the message waits in the receiver's mailbox, and `receive` picks messages out by pattern ([Erlang](https://www.erlang.org/doc/system/conc_prog.html), [Elixir](https://hexdocs.pm/elixir/processes.html))"
haskell = "[`Chan`](https://hackage.haskell.org/package/base/docs/Control-Concurrent-Chan.html), an unbounded channel; an [`MVar`](https://hackage.haskell.org/package/base/docs/Control-Concurrent-MVar.html) can also act as a channel, with `takeMVar` and `putMVar` as receive and send"
os = "[POSIX message queues](https://man7.org/linux/man-pages/man7/mq_overview.7.html) let processes exchange data as messages, delivered highest priority first"

[[concept]]
slug = "shared_memory"
title = "Shared memory"
summary = "Tasks read and write the same memory directly and coordinate with locks or atomics — the fastest way to share data, and the easiest to get wrong."
chapter = 2
causes = ["data_race"]
related = ["mutual_exclusion"]
reference = [["Wikipedia: Shared memory", "https://en.wikipedia.org/wiki/Shared_memory"]]
[concept.languages]
rust = "an [`Arc`](https://doc.rust-lang.org/std/sync/struct.Arc.html) is a thread-safe reference-counting pointer that does not allow mutation by itself; put a [`Mutex`](https://doc.rust-lang.org/std/sync/struct.Mutex.html) or an atomic inside to mutate"
go = "[`sync.Mutex`](https://pkg.go.dev/sync#Mutex) and `sync/atomic` exist, but the [`sync`](https://pkg.go.dev/sync) docs say most of them are for low-level library routines and higher-level synchronization is better done via channels"
c = "threads guard shared data with a mutex, [`pthread_mutex_lock`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutex_lock.html)"
cpp = "[`std::mutex`](https://en.cppreference.com/w/cpp/thread/mutex) and [`std::atomic`](https://en.cppreference.com/w/cpp/atomic/atomic)"
java = "`synchronized`, [`ReentrantLock`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html), and atomics such as [`AtomicInteger`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/atomic/AtomicInteger.html)"
python = "threads share objects and guard them with [`threading.Lock`](https://docs.python.org/3/library/threading.html#threading.Lock); processes can share a block of memory through [`multiprocessing.shared_memory`](https://docs.python.org/3/library/multiprocessing.shared_memory.html) (3.8)"
csharp = "the [`lock`](https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/lock) statement"
javascript = "workers can share a [`SharedArrayBuffer`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/SharedArrayBuffer), coordinated with [`Atomics`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Atomics)"
kotlin = "[shared mutable state](https://kotlinlang.org/docs/shared-mutable-state-and-concurrency.html) needs synchronizing as soon as coroutines run on a multi-threaded dispatcher such as `Dispatchers.Default`"
elixir_erlang = "an [ETS table](https://www.erlang.org/doc/apps/stdlib/ets.html) created `public` can be read and written by any process"
haskell = "an [`MVar`](https://hackage.haskell.org/package/base/docs/Control-Concurrent-MVar.html), a synchronising variable, or [STM](https://hackage.haskell.org/package/stm/docs/Control-Concurrent-STM.html) transactions"
os = "[POSIX shared memory](https://man7.org/linux/man-pages/man7/shm_overview.7.html): `shm_open` creates an object that each process maps into its address space with `mmap`"

[[concept]]
slug = "channel"
title = "Channel"
summary = "A typed conduit between tasks: one side sends values, the other receives them, in order."
aliases = ["queue", "mpsc"]
