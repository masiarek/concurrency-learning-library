[[concept]]
slug = "fork_join"
title = "Fork-join"
summary = "Split a task into subtasks, run them in parallel, wait for all of them and combine their results — recursively, until the pieces are small enough to do directly."
aliases = ["divide and conquer in parallel", "ForkJoinPool"]
chapter = 7
lessons = ["04_Waiting_For_Each_Other/a_barrier_and_a_latch", "07_Parallelism/data_parallel_or_task_parallel", "07_Parallelism/fork_join"]
is_a = ["task_parallelism"]
uses = ["work_stealing", "join"]
related = ["map_reduce"]
reference = [["Wikipedia: Fork–join model", "https://en.wikipedia.org/wiki/Fork%E2%80%93join_model"]]
[concept.languages]
rust = "Rayon's [`join`](https://docs.rs/rayon/latest/rayon/fn.join.html) runs two closures, potentially in parallel, and returns both results"
java = "[`ForkJoinPool`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ForkJoinPool.html) runs `ForkJoinTask`s, whose `fork` and `join` split and rejoin the work"
csharp = "[`Parallel.Invoke`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.parallel.invoke) runs actions in parallel and returns when all have completed"

