[[concept]]
slug = "openmp"
title = "OpenMP"
summary = "Compiler directives and a runtime that parallelize loops and sections of C, C++ and Fortran programs over shared memory."
lessons = ["07_Parallelism/a_parallel_iterator"]
aliases = ["OMP"]
uses = ["thread_pool"]
reference = [["OpenMP", "https://www.openmp.org/"]]
[concept.languages]
c = "Compiler directives defined by the [OpenMP specifications](https://www.openmp.org/specifications/); the GNU implementation is [libgomp](https://gcc.gnu.org/onlinedocs/libgomp/)"
cpp = "The same directives as C; C++17 [execution policies](https://en.cppreference.com/w/cpp/algorithm/execution_policy_tag_t) parallelize standard algorithms without them"

[[concept]]
slug = "mpi"
title = "MPI"
summary = "The Message Passing Interface: separate processes, often on separate machines, exchanging messages — the standard for distributed-memory parallel programs."
aliases = ["Message Passing Interface"]
uses = ["message_passing", "process"]
reference = [["MPI Forum", "https://www.mpi-forum.org/"]]

[[concept]]
slug = "numa"
title = "NUMA"
summary = "Non-uniform memory access: on a multi-socket machine some memory is closer to some cores, so where a thread runs changes how fast its memory is."
aliases = ["non-uniform memory access"]
related = ["cache_coherence"]
reference = [["Wikipedia: Non-uniform memory access", "https://en.wikipedia.org/wiki/Non-uniform_memory_access"]]
[concept.languages]
java = "HotSpot's [`-XX:+UseNUMA`](https://docs.oracle.com/en/java/javase/25/docs/specs/man/java.html) option"
os = "[`numa(7)`](https://man7.org/linux/man-pages/man7/numa.7.html), [`set_mempolicy(2)`](https://man7.org/linux/man-pages/man2/set_mempolicy.2.html), and `numactl` to bind a program to nodes"

[[concept]]
slug = "smt"
title = "Simultaneous multithreading"
summary = "One physical core presenting two or more logical cores to the operating system, sharing its execution resources between them."
aliases = ["SMT", "Hyper-Threading"]
notes = [["HW - CPUs - pipelines - caching - HT - memory bandwidth - latency", "https://docs.google.com/document/u/0/d/12TY3QDOenDFezomACTM7BV3rKpFnrADXMT5q8Yc653Q/edit"]]
reference = [["Wikipedia: Simultaneous multithreading", "https://en.wikipedia.org/wiki/Simultaneous_multithreading"]]
[concept.languages]
go = "[`runtime.NumCPU`](https://pkg.go.dev/runtime#NumCPU) counts logical CPUs"
python = "[`os.cpu_count`](https://docs.python.org/3/library/os.html#os.cpu_count) returns logical CPUs"
csharp = "[`Environment.ProcessorCount`](https://learn.microsoft.com/en-us/dotnet/api/system.environment.processorcount) counts logical processors, capped by CPU affinity and CPU limits"
javascript = "[`navigator.hardwareConcurrency`](https://developer.mozilla.org/en-US/docs/Web/API/Navigator/hardwareConcurrency) counts logical processors"
os = "[`sched_setaffinity(2)`](https://man7.org/linux/man-pages/man2/sched_setaffinity.2.html) pins a thread to chosen logical CPUs"

[[concept]]
slug = "cache_coherence"
title = "Cache coherence"
summary = "Keeping several cached copies of the same data consistent when one of them is written — done in hardware between a CPU's cores, at a cost that false sharing exposes."
lessons = ["02_Shared_State/reordering_and_the_memory_model", "07_Parallelism/false_sharing"]
aliases = ["cache invalidation", "write-back"]
notes = [
  ["Cache coherence", "https://docs.google.com/document/d/11AUT-9ZiaDLML1DHaKz41nj_dmzj0-fSXxHyxMGj_4U/edit?tab=t.0"],
  ["cache invalidation", "https://docs.google.com/document/d/1DHSM56i69dzhauCUMym3o5DfyA1RJkichLYl4KFKn9Q/edit?tab=t.0"],
  ["write-back with invalidation", "https://docs.google.com/document/d/1MYeif5pOPcuarLG0aae17yq8oqPFZwY3_y9j17h-NFU/edit?tab=t.0"],
  ["shared data across different caches", "https://docs.google.com/document/d/1JSbyd8pdLLMCtMUdosY1amPrzgdJu_6uHIGQGSkL9YA/edit?tab=t.0"],
]
reference = [["Wikipedia: Cache coherence", "https://en.wikipedia.org/wiki/Cache_coherence"]]

[[concept]]
slug = "gil"
title = "Global interpreter lock"
summary = "A lock that lets only one thread run interpreter code at a time — CPython's, and Ruby's — so threads give concurrency but not CPU parallelism; CPython 3.13 added an optional build without it."
aliases = ["GIL", "GVL", "free threading"]
chapter = 7
lessons = ["07_Parallelism/cpu_bound_speedup", "07_Parallelism/the_gil_and_free_threaded_python", "08_Processes/multiprocessing_instead_of_threads"]
uses = ["mutex"]
related = ["multiprocessing", "io_bound_and_cpu_bound"]
reference = [["PEP 703: Making the Global Interpreter Lock Optional in CPython", "https://peps.python.org/pep-0703/"]]
[concept.languages]
python = "CPython's [GIL](https://docs.python.org/3/glossary.html#term-global-interpreter-lock); the [free-threaded build](https://docs.python.org/3/howto/free-threading-python.html), available since 3.13, disables it"
other = "CRuby holds its Global VM Lock (GVL) per [`Ractor`](https://docs.ruby-lang.org/en/master/Ractor.html), so ractors run in parallel where threads cannot"

[[concept]]
slug = "multiprocessing"
