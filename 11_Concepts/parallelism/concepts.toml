uses = ["process", "ipc"]
notes = [
  ["multiprocessing python", "https://docs.google.com/document/d/1cOE8bkU-PY_V_0tDGixPK0OO13PRWoAZzbLeJ-IiA58/edit?tab=t.0"],
  ["multi-processing - general - multiprocessing", "https://docs.google.com/document/d/14T579Iokz3DEBIQZ_jRHwSMlo48xH8eey43kN2bMgQU/edit?tab=t.0"],
]
