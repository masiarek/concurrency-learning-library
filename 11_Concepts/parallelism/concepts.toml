[category]
title = "Parallelism"
order = 9
blurb = "Using more cores to finish sooner: splitting data and work across them, and the hardware facts that decide whether it helps."

[[concept]]
slug = "data_parallelism"
title = "Data parallelism"
summary = "The same operation applied to many pieces of data at once, each piece on its own core or vector lane."
chapter = 7
lessons = ["07_Parallelism/splitting_a_sum_across_workers", "07_Parallelism/false_sharing", "07_Parallelism/data_parallel_or_task_parallel", "07_Parallelism/a_parallel_iterator", "07_Parallelism/map_and_reduce"]
is_a = ["parallelism"]
contrasts = ["task_parallelism"]
pages = [["Go: Fan-out, fan-in", "https://masiarek.github.io/go-learning-library/06_Patterns/fan_out_fan_in/index.html"]]
reference = [["Wikipedia: Data parallelism", "https://en.wikipedia.org/wiki/Data_parallelism"]]
[concept.languages]
rust = "Rayon's [parallel iterators](https://docs.rs/rayon/latest/rayon/iter/index.html); the standard library offers only [`thread::scope`](https://doc.rust-lang.org/std/thread/fn.scope.html)"
cpp = "[`std::execution::par`](https://en.cppreference.com/w/cpp/algorithm/execution_policy_tag_t) (C++17) on a standard algorithm, or `par_unseq` to allow vectorization as well"
java = "[Parallel streams](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/package-summary.html#Parallelism)"
python = "[`multiprocessing.Pool.map`](https://docs.python.org/3/library/multiprocessing.html#multiprocessing.pool.Pool.map)"
csharp = "[Data parallelism](https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/data-parallelism-task-parallel-library) with `Parallel.For` and `Parallel.ForEach`"
swift = "[`DispatchQueue.concurrentPerform`](https://developer.apple.com/documentation/dispatch/dispatchqueue/concurrentperform%28iterations:execute:%29) runs a block the given number of times, balanced across cores"
haskell = "[`parMap`](https://hackage.haskell.org/package/parallel/docs/Control-Parallel-Strategies.html#v:parMap) in the `parallel` package"

[[concept]]
slug = "task_parallelism"
title = "Task parallelism"
summary = "Different tasks, possibly doing different things, running at the same time on different cores."
chapter = 7
lessons = ["05_Message_Passing/a_pipeline_of_stages", "07_Parallelism/data_parallel_or_task_parallel", "07_Parallelism/fork_join"]
is_a = ["parallelism"]
reference = [["Wikipedia: Task parallelism", "https://en.wikipedia.org/wiki/Task_parallelism"]]
[concept.languages]
rust = "Rayon's [`join`](https://docs.rs/rayon/latest/rayon/fn.join.html) runs two closures, potentially in parallel"
go = "`go` statements, with a [`sync.WaitGroup`](https://pkg.go.dev/sync#WaitGroup) to wait for them"
cpp = "[`std::async`](https://en.cppreference.com/w/cpp/thread/async) with `std::launch::async`"
java = "[`ForkJoinTask`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ForkJoinTask.html) `fork` and `join`; [`StructuredTaskScope`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/StructuredTaskScope.html) is still a preview API in JDK 25"
python = "[`Executor.submit`](https://docs.python.org/3/library/concurrent.futures.html#concurrent.futures.Executor.submit)"
csharp = "[`Parallel.Invoke`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.parallel.invoke) and [task parallelism](https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/task-based-asynchronous-programming)"
swift = "[`async let` and task groups](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/)"

[[concept]]
slug = "map_reduce"
title = "Map-reduce"
summary = "Apply a function to every item independently, then combine the results with an associative operation, so that both halves can be split across workers."
aliases = ["MapReduce"]
chapter = 7
lessons = ["07_Parallelism/splitting_a_sum_across_workers", "07_Parallelism/data_parallel_or_task_parallel", "07_Parallelism/map_and_reduce"]
is_a = ["data_parallelism"]
reference = [["Wikipedia: MapReduce", "https://en.wikipedia.org/wiki/MapReduce"]]
[concept.languages]
rust = "Rayon's [`reduce`](https://docs.rs/rayon/latest/rayon/iter/trait.ParallelIterator.html#method.reduce) takes an identity value as well as the combining operation"
cpp = "[`std::transform_reduce`](https://en.cppreference.com/w/cpp/algorithm/transform_reduce); with a non-associative or non-commutative operation the result is non-deterministic"
java = "[`Stream.reduce`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/stream/Stream.html) requires an associative accumulator, so that a parallel stream can split the work"
other = "[Hadoop MapReduce](https://hadoop.apache.org/docs/stable/hadoop-mapreduce-client/hadoop-mapreduce-client-core/MapReduceTutorial.html) runs the same split across a cluster"

[[concept]]
slug = "parallel_prefix_sum"
title = "Parallel prefix sum"
summary = "Computing every running total of a sequence in a number of rounds that grows with the logarithm of its length — a building block of many data-parallel algorithms."
aliases = ["prefix scan", "scan"]
is_a = ["data_parallelism"]
reference = [["Wikipedia: Prefix sum — parallel algorithms", "https://en.wikipedia.org/wiki/Prefix_sum#Parallel_algorithms"]]
[concept.languages]
cpp = "[`std::inclusive_scan`](https://en.cppreference.com/w/cpp/algorithm/inclusive_scan) and `std::exclusive_scan` (C++17) accept an execution policy"
java = "[`Arrays.parallelPrefix`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Arrays.html)"

[[concept]]
slug = "parallel_iterators"
title = "Parallel iterators and streams"
summary = "A library that spreads an iterator's work over a thread pool with one method call — Rayon's `par_iter`, Java's `parallelStream`."
aliases = ["rayon", "parallel streams", "PLINQ"]
chapter = 7
lessons = ["07_Parallelism/data_parallel_or_task_parallel", "07_Parallelism/a_parallel_iterator"]
is_a = ["data_parallelism"]
uses = ["work_stealing", "thread_pool"]
[concept.languages]
rust = "Rayon's [`par_iter`](https://docs.rs/rayon/latest/rayon/) gives parallel versions of iterator methods such as `map`, `filter` and `fold`"
cpp = "Standard algorithms take an [execution policy](https://en.cppreference.com/w/cpp/algorithm/execution_policy_tag_t) rather than a parallel iterator"
java = "[`Collection.parallelStream`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/Collection.html#parallelStream%28%29), or `parallel()` on a stream"
python = "[`Executor.map`](https://docs.python.org/3/library/concurrent.futures.html#concurrent.futures.Executor.map) on a thread or process pool"
csharp = "[PLINQ](https://learn.microsoft.com/en-us/dotnet/standard/parallel-programming/introduction-to-plinq): `AsParallel()` on a LINQ query"
elixir_erlang = "[`Task.async_stream`](https://hexdocs.pm/elixir/Task.html#async_stream/3) runs a function on each element in its own task, by default as many at once as there are schedulers online"

[[concept]]
slug = "simd"
title = "SIMD"
summary = "One CPU instruction applied to several numbers at once: parallelism inside a single core."
aliases = ["vectorization", "single instruction, multiple data"]
is_a = ["data_parallelism"]
reference = [["Wikipedia: Single instruction, multiple data", "https://en.wikipedia.org/wiki/Single_instruction,_multiple_data"]]
[concept.languages]
rust = "Platform intrinsics in [`std::arch`](https://doc.rust-lang.org/std/arch/index.html); the portable [`std::simd`](https://doc.rust-lang.org/std/simd/index.html) is nightly-only"
cpp = "[`std::simd`](https://en.cppreference.com/w/cpp/numeric/simd) in C++26, after [`std::experimental::simd`](https://en.cppreference.com/w/cpp/experimental/simd)"
java = "The [Vector API](https://docs.oracle.com/en/java/javase/25/docs/api/jdk.incubator.vector/jdk/incubator/vector/package-summary.html), still an incubator module in JDK 25"
csharp = "[`Vector<T>`](https://learn.microsoft.com/en-us/dotnet/api/system.numerics.vector-1), which supports hardware acceleration, and the instruction-set register types of [`System.Runtime.Intrinsics`](https://learn.microsoft.com/en-us/dotnet/api/system.runtime.intrinsics)"
swift = "[`SIMD`](https://developer.apple.com/documentation/swift/simd) vector types such as `SIMD4<Float>` in the standard library"

[[concept]]
slug = "gpu_computing"
title = "GPU computing"
