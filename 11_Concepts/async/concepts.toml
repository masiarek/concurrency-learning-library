java = "[`Thread.join`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html), or `get` on a [`Future`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Future.html)"
python = "[`Thread.join`](https://docs.python.org/3/library/threading.html#threading.Thread.join)"
csharp = "[`Thread.Join`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.thread.join); for tasks, `await` or [`Task.WhenAll`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.whenall)"
javascript = "[`Promise.all`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise/all), which rejects as soon as any input promise rejects"
kotlin = "[`Job.join`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/-job/join.html) suspends until the job is complete, for any reason"
swift = "`await` a task's `value` ([Swift book](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/))"
elixir_erlang = "[`Task.await`](https://hexdocs.pm/elixir/Task.html)"
os = "[`waitpid`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/waitpid.html) for a child process"

[[concept]]
slug = "function_coloring"
title = "Function coloring"
summary = "An async function can call a sync one, but not the other way round without help, so async-ness spreads up the call graph and splits libraries into two colors."
aliases = ["what color is your function", "sync and async functions"]
chapter = 6
related = ["blocking_the_event_loop"]
notes = [["async and ffi - async & FFI - not exactly a love story", "https://docs.google.com/document/d/1vBvNkxdRh2b88PkKupNiZssYZAyUFY3IFQ1UEgbfa-Y/edit?tab=t.0"]]
reference = [["Bob Nystrom: What Color is Your Function?", "https://journal.stuffwithstuff.com/2015/02/01/what-color-is-your-function/"]]
[concept.languages]
rust = "futures are lazy until awaited, and Rust bundles no runtime, so sync code needs one from a crate to run an async function ([Book](https://doc.rust-lang.org/book/ch17-01-futures-and-syntax.html))"
go = "no colors: any function can run in its own goroutine with a [`go` statement](https://go.dev/ref/spec#Go_statements), and a blocking call does not hold up the other goroutines ([FAQ](https://go.dev/doc/faq#goroutines))"
java = "[JEP 444](https://openjdk.org/jeps/444) chose virtual threads over async/await because async/await would split the world between APIs for threads and APIs for coroutines"
python = "`await`, `async for` and `async with` are allowed only in a [coroutine function](https://docs.python.org/3/reference/compound_stmts.html#coroutine-function-definition); sync code starts one with [`asyncio.run`](https://docs.python.org/3/library/asyncio-runner.html#asyncio.run), and async code can hand a blocking call to [`asyncio.to_thread`](https://docs.python.org/3/library/asyncio-task.html#asyncio.to_thread)"
javascript = "[`await`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await) is allowed only inside async functions and at the top level of a module"
kotlin = "a suspending function can be called only from another suspending function ([basics](https://kotlinlang.org/docs/coroutines-basics.html)); [`runBlocking`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/run-blocking.html) bridges from blocking code by blocking the thread"

[[concept]]
slug = "async_stream"
title = "Async stream"
summary = "An asynchronous iterator: a sequence whose items arrive over time, each one awaited in turn."
aliases = ["Stream", "async generator", "AsyncIterator", "Sink"]
chapter = 6
uses = ["future_and_promise"]
pages = [
  ["Rust: Streams, sinks, and pipelining", "https://masiarek.github.io/rust-learning-library/35_Async/building_minidb/streams_sinks_and_pipelining/index.html"],
]
notes = [["sink - rust - futures::sink::Sink", "https://docs.google.com/document/d/1CqiyECIqf2na7Xlkc3WqurQf5kQxHDm44qY8-n3g_9s/edit?tab=t.0"]]
[concept.languages]
rust = "no stable trait: std's [`AsyncIterator`](https://doc.rust-lang.org/std/async_iter/trait.AsyncIterator.html) is a nightly-only experimental API"
java = "[`Flow.Publisher`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Flow.html), with the subscriber requesting items"
python = "[asynchronous generators](https://docs.python.org/3/reference/expressions.html#asynchronous-generator-functions), consumed with [`async for`](https://docs.python.org/3/reference/compound_stmts.html#async-for)"
csharp = "[`IAsyncEnumerable<T>`](https://learn.microsoft.com/en-us/dotnet/api/system.collections.generic.iasyncenumerable-1), consumed with [`await foreach`](https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/generate-consume-asynchronous-stream)"
javascript = "[`async function*`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function*) generators, consumed with [`for await...of`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/for-await...of)"
kotlin = "[`Flow`](https://kotlinlang.org/docs/coroutines-flow.html): a cold flow is lazy and runs anew for each collector, a hot flow shares its values with all collectors"
swift = "[`AsyncSequence`](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/), iterated with `for await`; an [`AsyncStream`](https://developer.apple.com/documentation/swift/asyncstream) builds one from a closure"

[[concept]]
slug = "pinning"
title = "Pinning"
summary = "Rust's guarantee that a value will not move in memory, needed because an async state machine may hold pointers into itself."
aliases = ["Pin", "Unpin"]
chapter = 6
reference = [["Rust std: module pin", "https://doc.rust-lang.org/std/pin/index.html"]]
[concept.languages]
rust = "[`Pin`](https://doc.rust-lang.org/std/pin/struct.Pin.html) keeps a pointee from being moved unless it implements `Unpin`"
csharp = "a different pinning: [`fixed`](https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/statements/fixed) stops the garbage collector from relocating a variable while a pointer to it is in use, and so does a [`Pinned`](https://learn.microsoft.com/en-us/dotnet/api/system.runtime.interopservices.gchandletype) `GCHandle`"

[[concept]]
slug = "blocking_the_event_loop"
title = "Blocking the event loop"
summary = "A task that computes for a long time, or makes a blocking call, on the runtime's thread stops every other task on that thread until it is done."
aliases = ["blocking in async code"]
chapter = 6
causes = ["starvation"]
related = ["event_loop"]
pages = [
  ["Rust: Diagnosing a stuck runtime", "https://masiarek.github.io/rust-learning-library/35_Async/building_minidb/diagnosing_a_stuck_runtime/index.html"],
  ["Rust: Common async pitfalls", "https://masiarek.github.io/rust-learning-library/35_Async/common_async_pitfalls/index.html"],
]
[concept.languages]
rust = "tokio's [`spawn_blocking`](https://docs.rs/tokio/latest/tokio/task/fn.spawn_blocking.html) runs blocking work on a thread dedicated to it, because a future that does not yield keeps the executor from driving other futures"
go = "there is no event loop to block, and since [Go 1.14](https://go.dev/doc/go1.14#runtime) goroutines are asynchronously preemptible, so even a loop without function calls cannot hold up the scheduler"
java = "a virtual thread that blocks releases its platform thread; [JEP 491](https://openjdk.org/jeps/491) (JDK 24) made that happen inside `synchronized` too"
python = "blocking (CPU-bound) code should not be called directly; `loop.run_in_executor` or [`asyncio.to_thread`](https://docs.python.org/3/library/asyncio-task.html#asyncio.to_thread) moves it off the loop ([asyncio guide](https://docs.python.org/3/library/asyncio-dev.html#running-blocking-code))"
javascript = "Node runs callbacks on the Event Loop and expensive tasks on a Worker Pool; a thread blocked on behalf of one client cannot serve any other ([guide](https://nodejs.org/en/learn/asynchronous-work/dont-block-the-event-loop))"

[[concept]]
slug = "reactive_programming"
title = "Reactive programming"
summary = "Describing a program as streams of values over time and the values derived from them, with changes propagating through automatically."
aliases = ["Rx", "ReactiveX", "Reactive Extensions", "observables"]
uses = ["async_stream"]
notes = [["Reactive Programming vs Asynchronous Programming", "https://docs.google.com/document/u/0/d/13Xtxk5uCx66-69cMmCQzR4AGM084u-7MvJ00xCiuCjs/edit"]]
reference = [["Wikipedia: Reactive programming", "https://en.wikipedia.org/wiki/Reactive_programming"]]
[concept.languages]
java = "[`Flow`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Flow.html), the JDK's version of the reactive-streams interfaces"
csharp = "[`IObservable<T>`](https://learn.microsoft.com/en-us/dotnet/api/system.iobservable-1), a provider for push-based notification"
kotlin = "[`Flow`](https://kotlinlang.org/docs/coroutines-flow.html), including `StateFlow`, a `SharedFlow` that always holds the latest state value"
swift = "[Combine](https://developer.apple.com/documentation/combine): publishers expose values that change over time, and subscribers receive them"
other = "[ReactiveX](https://reactivex.io/intro.html), whose Observable is the asynchronous, push counterpart of an Iterable"

[[concept]]
slug = "timers"
title = "Timers and tickers"
summary = "A runtime facility that fires once after a delay, or repeatedly at an interval, and delivers it as a callback, a value on a channel, or something to await."
aliases = ["ticker", "interval", "setTimeout"]
chapter = 6
related = ["timeout", "event_loop"]
pages = [["Go: A timeout is a channel", "https://masiarek.github.io/go-learning-library/03_Select/a_timeout_is_a_channel/index.html"]]
[concept.languages]
rust = "Tokio's [`time`](https://docs.rs/tokio/latest/tokio/time/index.html) module: `sleep`, `interval` and `timeout`"
go = "[`time.Timer`](https://pkg.go.dev/time#Timer) and [`time.Ticker`](https://pkg.go.dev/time#Ticker), each delivering on a channel"
java = "[`ScheduledExecutorService`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/ScheduledExecutorService.html) runs tasks after a delay or periodically"
python = "[`loop.call_later`](https://docs.python.org/3/library/asyncio-eventloop.html#asyncio.loop.call_later) on the event loop, and [`threading.Timer`](https://docs.python.org/3/library/threading.html#timer-objects) for threads"
csharp = "[`PeriodicTimer`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.periodictimer), whose ticks are awaited"
javascript = "[`setTimeout`](https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout) and `setInterval`"
os = "[`timerfd_create`](https://man7.org/linux/man-pages/man2/timerfd_create.2.html) makes a timer readable as a file descriptor, so an event loop can wait on it"
