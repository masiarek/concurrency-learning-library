[category]
title = "Async"
order = 8
blurb = "Not waiting: callbacks, futures and promises, async and await, and what cancelling, timing out and blocking mean once a task can pause."

[[concept]]
slug = "event_driven_programming"
title = "Event-driven programming"
summary = "A program built as handlers that run when events arrive — a click, a message, a ready socket — instead of as one flow from top to bottom."
chapter = 6
uses = ["event_loop", "callback"]
contrasts = ["reactive_programming"]
reference = [["Wikipedia: Event-driven programming", "https://en.wikipedia.org/wiki/Event-driven_programming"]]
aliases = ["event-driven architecture"]
[concept.languages]
go = "no event loop in user code: a goroutine makes an ordinary blocking call, and the runtime moves the other goroutines to a runnable thread ([FAQ](https://go.dev/doc/faq#goroutines))"
python = "the [asyncio event loop](https://docs.python.org/3/library/asyncio-eventloop.html) runs asynchronous tasks and callbacks, network I/O and subprocesses"
csharp = "[events](https://learn.microsoft.com/en-us/dotnet/standard/events/), built on the delegate model and declared with the `event` keyword"
javascript = "the host's event loop takes jobs from a job queue ([execution model](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Execution_model)); handlers are attached with [`addEventListener`](https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener), or with Node's [`EventEmitter`](https://nodejs.org/api/events.html)"
os = "[epoll](https://man7.org/linux/man-pages/man7/epoll.7.html) reports which of many file descriptors can do I/O, edge- or level-triggered"

[[concept]]
slug = "callback"
title = "Callback"
summary = "A function handed to an operation to be called when the operation finishes — the oldest way to write asynchronous code, and the source of deeply nested callback code."
aliases = ["completion handler", "callback hell"]
chapter = 6
alternative = ["future_and_promise"]
notes = [["Callback-Based - Asynchronous Programming", "https://docs.google.com/document/d/1zFZ8NF6R3-81b46gVYpKPc-woMDFy-wo2wie158ODs8/edit?tab=t.0"]]
reference = [["Wikipedia: Callback (computer programming)", "https://en.wikipedia.org/wiki/Callback_(computer_programming)"]]
[concept.languages]
c = "a function pointer; POSIX [AIO](https://man7.org/linux/man-pages/man7/aio.7.html) can report a finished operation by starting a thread (`SIGEV_THREAD`)"
java = "[`CompletableFuture`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html) takes callbacks such as `thenApply` and `thenAccept`"
python = "[`Future.add_done_callback`](https://docs.python.org/3/library/asyncio-future.html#asyncio.Future.add_done_callback) and [`loop.call_soon`](https://docs.python.org/3/library/asyncio-eventloop.html#asyncio.loop.call_soon); asyncio futures exist to bridge callback-based code with async/await"
csharp = "the [Asynchronous Programming Model](https://learn.microsoft.com/en-us/dotnet/standard/asynchronous-programming-patterns/asynchronous-programming-model-apm): `BeginOperationName` takes an `AsyncCallback` that is called when the operation completes"
javascript = "a [callback function](https://developer.mozilla.org/en-US/docs/Glossary/Callback_function), passed into another function and invoked inside it"
swift = "completion handlers, which the [Swift book](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/) shows piling up as nested closures before it introduces `async` and `await`"

[[concept]]
slug = "future_and_promise"
title = "Future and promise"
summary = "A placeholder for a result that is not ready yet: the future is the side that waits for the value, the promise the side that supplies it."
