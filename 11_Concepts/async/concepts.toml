python = "[`asyncio.timeout`](https://docs.python.org/3/library/asyncio-task.html#asyncio.timeout) cancels the task and turns the `CancelledError` into a `TimeoutError`; [`asyncio.wait_for`](https://docs.python.org/3/library/asyncio-task.html#asyncio.wait_for)"
csharp = "[`CancellationTokenSource.CancelAfter`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.cancellationtokensource.cancelafter), and [`Task.WaitAsync`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.tasks.task.waitasync) with a `TimeSpan`"
