  ["async - rust - concurrency - main - idx", "https://docs.google.com/document/u/0/d/1V8gave_8PBAPOj3SgO91rktMc3u-3FLIExFu_0HNJsw/edit"],
  ["Asynchronous Programming in Rust (notes)", "https://docs.google.com/document/u/0/d/15kighMDIDhny4QjmTyiEjVUeBe_GqTMb23rVH3rNWAQ/edit"],
  ["book rust asynchronous programming", "https://docs.google.com/document/u/0/d/10K6F_oPLDwp9oMmeOjA_yEJlZJyrUzGvXD9MLePpDd8/edit"],
  ["Error handling in async functions", "https://docs.google.com/document/d/18z0CoZUSqptiWohFcLyKKOph22f5DgpxiQO791phWEc/edit?tab=t.0"],
  ["asynchronous python", "https://docs.google.com/document/u/0/d/1tkAkfrrVTZY30QMNLV211PXKcQooMhDHBL1lF_27_ic/edit"],
  ["async kata - python", "https://docs.google.com/document/d/1og40CcSWMRJCs2H98L8VGFoi12eX-DYNtFBAl_BQrFQ/edit?tab=t.0"],
  ["async - concurrent - C# - main", "https://docs.google.com/document/d/1RA-b0Ib0k0Vly1mMsvENHLwJ4cHG_mrhEFY7LKDxI-g/edit?tab=t.0"],
  ["async method - c#", "https://docs.google.com/document/d/1oJ7jSmz8DkWkGE_8nP9KxsUgGk_xpM2IygCWLrV0FJo/edit?tab=t.0"],
  ["async - dart programming - main", "https://docs.google.com/document/d/1k7sgra_fO8kFhNIN7QRN2dgC7z0KMo1sXboan8WG4O8/edit?tab=t.0"],
]
reference = [["Wikipedia: Async/await", "https://en.wikipedia.org/wiki/Async/await"]]
[concept.languages]
rust = "`async fn` and `.await`; an async function does no work until its future is polled ([reference](https://doc.rust-lang.org/reference/items/functions.html#async-functions)), and while most languages with async bundle a runtime, Rust does not ([Book](https://doc.rust-lang.org/book/ch17-01-futures-and-syntax.html))"
go = "neither: code blocks in ordinary calls, and when a goroutine blocks the runtime moves the others to a runnable thread ([FAQ](https://go.dev/doc/faq#goroutines))"
cpp = "C++20 [coroutines](https://en.cppreference.com/w/cpp/language/coroutines) (`co_await`, `co_yield`, `co_return`) are stackless; C++20 ships handles and traits but no task type, which the [support library](https://en.cppreference.com/w/cpp/coroutine) adds as `std::execution::task` in C++26"
java = "no async/await: [JEP 444](https://openjdk.org/jeps/444) delivered virtual threads in JDK 21 and rejected async/await because it would split the world between APIs for threads and APIs for coroutines; [`CompletableFuture`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/CompletableFuture.html) chains actions on completion"
python = "[`async def` and `await`](https://docs.python.org/3/reference/compound_stmts.html#coroutine-function-definition) on [asyncio's event loop](https://docs.python.org/3/library/asyncio-eventloop.html); simply calling a coroutine does not schedule it ([docs](https://docs.python.org/3/library/asyncio-task.html#coroutines))"
csharp = "an `async` method returns a [`Task`](https://learn.microsoft.com/en-us/dotnet/csharp/asynchronous-programming/) that is already running: only tasks made with a `Task` constructor start cold ([TAP](https://learn.microsoft.com/en-us/dotnet/standard/asynchronous-programming-patterns/task-based-asynchronous-pattern-tap)); the compiler turns the method into a state machine"
javascript = "an [`async function`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function) runs synchronously up to its first `await`, so its work starts on the call; [`await`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/await) is allowed only in async functions and at the top level of a module"
kotlin = "`suspend` functions, called with no `await` keyword and only from other suspending functions ([basics](https://kotlinlang.org/docs/coroutines-basics.html)); [`async`](https://kotlinlang.org/docs/composing-suspending-functions.html) returns a `Deferred` to await, and starts lazily only if asked to"
swift = "`async` functions with `await` marking each possible suspension point, plus `async let` and task groups ([Swift book](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/))"

[[concept]]
slug = "async_state_machine"
title = "Async functions as state machines"
summary = "A compiler turns an async function into a state machine whose states are its suspension points, storing the local variables that live across each await."
chapter = 6
uses = ["coroutine"]
related = ["async_await", "pinning"]
pages = [
  ["Rust: `async fn` and `.await`", "https://masiarek.github.io/rust-learning-library/35_Async/async_fn_and_await/index.html"],
]
notes = [["async functions - state machines - rust", "https://docs.google.com/document/d/1mQYBLftNU6A4mo4hA5gsJVMOfvWY79dNFSagAlZETVU/edit?tab=t.0"]]
[concept.languages]
rust = "the compiler turns async code into an invisible state machine that a runtime drives ([Book](https://doc.rust-lang.org/book/ch17-01-futures-and-syntax.html))"
cpp = "a [coroutine](https://en.cppreference.com/w/cpp/language/coroutines) keeps its promise, parameters, suspension point and locals in a coroutine state, allocated dynamically unless the allocation is optimized out"
csharp = "the compiler generates a state machine for each async method, implementing [`IAsyncStateMachine`](https://learn.microsoft.com/en-us/dotnet/api/system.runtime.compilerservices.iasyncstatemachine)"
kotlin = "a suspended computation is resumed through a [`Continuation`](https://kotlinlang.org/api/core/kotlin-stdlib/kotlin.coroutines/-continuation/), which represents the rest of the work after a suspension point"

[[concept]]
slug = "structured_concurrency"
title = "Structured concurrency"
summary = "Concurrent tasks are started inside a scope that does not end until all of them have, so no task outlives the code that started it and every error reaches that code."
aliases = ["nursery", "task group"]
chapter = 6
prevents = ["task_leak"]
uses = ["join", "cancellation"]
lessons = ["01_Threads/who_waits_when_main_returns", "01_Threads/lending_a_local_to_a_thread"]
pages = [["Go: The first error cancels the rest", "https://masiarek.github.io/go-learning-library/06_Patterns/first_error_cancels_the_rest/index.html"]]
reference = [["Wikipedia: Structured concurrency", "https://en.wikipedia.org/wiki/Structured_concurrency"]]
[concept.languages]
rust = "[`thread::scope`](https://doc.rust-lang.org/std/thread/fn.scope.html): every thread spawned in the scope is joined before it returns, which is why scoped threads may borrow local data"
go = "not in std; [`errgroup`](https://pkg.go.dev/golang.org/x/sync/errgroup) waits for a group of goroutines and cancels their context the first time one returns an error"
cpp = "no scope construct; a [`std::jthread`](https://en.cppreference.com/w/cpp/thread/jthread) (C++20) joins on destruction, where a still-joinable [`std::thread`](https://en.cppreference.com/w/cpp/thread/thread/~thread) calls `std::terminate`"
java = "[`StructuredTaskScope`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/StructuredTaskScope.html), a preview API in JDK 25 ([JEP 505](https://openjdk.org/jeps/505), fifth preview) and again in JDK 26 ([JEP 525](https://openjdk.org/jeps/525), sixth preview)"
python = "[`asyncio.TaskGroup`](https://docs.python.org/3/library/asyncio-task.html#asyncio.TaskGroup), added in 3.11"
kotlin = "the default: coroutines start inside a `CoroutineScope`, and [`coroutineScope`](https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/coroutine-scope.html) returns only when its block and all coroutines launched in it have completed"
swift = "task groups and `async let` create child tasks; the [Swift book](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/) calls that explicit parent-child relationship structured concurrency"
other = "Trio's [nurseries](https://trio.readthedocs.io/en/stable/reference-core.html#tasks-let-you-do-multiple-things-at-once), in Python"

[[concept]]
slug = "cancellation"
title = "Cancellation"
summary = "Asking a running task to stop early and release what it holds; in most languages the task has to cooperate by noticing the request."
aliases = ["cancellation token", "context cancellation", "stop token"]
chapter = 6
prevents = ["task_leak"]
related = ["timeout"]
pages = [
  ["Go: One `cancel` reaches every goroutine", "https://masiarek.github.io/go-learning-library/05_Context/cancel_reaches_every_goroutine/index.html"],
  ["Go: Cancel with a cause", "https://masiarek.github.io/go-learning-library/05_Context/cancel_with_a_cause/index.html"],
  ["Go: The first error cancels the rest", "https://masiarek.github.io/go-learning-library/06_Patterns/first_error_cancels_the_rest/index.html"],
  ["Rust: Cancellation", "https://masiarek.github.io/rust-learning-library/35_Async/building_minidb/cancellation/index.html"],
]
[concept.languages]
rust = "a future is cancelled by dropping it; tokio's [`select!`](https://docs.rs/tokio/latest/tokio/macro.select.html) cancels the branches that lose that way, which is why its docs discuss cancellation safety"
go = "a [`context`](https://pkg.go.dev/context#WithCancel): calling `cancel` closes the context's `Done` channel, and with it those of the contexts derived from it; each goroutine has to watch `Done`"
c = "[`pthread_cancel`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_cancel.html) asks; the target thread's cancelability state and type decide when it takes effect"
cpp = "[`std::stop_token`](https://en.cppreference.com/w/cpp/thread/stop_token) (C++20) tells a thread whether a stop has been requested; a [`std::jthread`](https://en.cppreference.com/w/cpp/thread/jthread) can be stopped this way"
java = "[`Thread.interrupt`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html), which a blocked `sleep`, `wait` or `join` answers with `InterruptedException`; [`Future.cancel`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/concurrent/Future.html)"
python = "[`Task.cancel`](https://docs.python.org/3/library/asyncio-task.html#asyncio.Task.cancel) raises `CancelledError` inside the task at its next opportunity"
csharp = "a [`CancellationToken`](https://learn.microsoft.com/en-us/dotnet/standard/threading/cancellation-in-managed-threads), a cooperative model: each listener must notice the request and respond to it"
javascript = "an [`AbortController`](https://developer.mozilla.org/en-US/docs/Web/API/AbortController) and its `AbortSignal`"
kotlin = "[cooperative](https://kotlinlang.org/docs/coroutines-cancellation.html): a coroutine reacts to cancellation only when it suspends or checks for it explicitly"
swift = "cooperative: a task checks with `Task.checkCancellation()` or `Task.isCancelled` ([Swift book](https://docs.swift.org/swift-book/documentation/the-swift-programming-language/concurrency/))"
elixir_erlang = "[`Process.exit/2`](https://hexdocs.pm/elixir/Process.html#exit/2) sends an exit signal; a process that traps exits receives it as a message instead"
haskell = "[`killThread`](https://hackage.haskell.org/package/base/docs/Control-Concurrent.html#v:killThread) raises the `ThreadKilled` exception in the target thread"

[[concept]]
slug = "timeout"
title = "Timeout"
summary = "Giving up on an operation after a time limit — which, in concurrent code, means cancelling or abandoning whatever was still running on its behalf."
