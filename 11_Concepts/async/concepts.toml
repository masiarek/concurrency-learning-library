chapter = 6
uses = ["cancellation"]
prevents = ["deadlock"]
pages = [
  ["Go: A timeout is a channel", "https://masiarek.github.io/go-learning-library/03_Select/a_timeout_is_a_channel/index.html"],
  ["Go: A deadline is a cancel with a clock", "https://masiarek.github.io/go-learning-library/05_Context/a_deadline_is_a_cancel_with_a_clock/index.html"],
  ["Rust: Cancellation", "https://masiarek.github.io/rust-learning-library/35_Async/building_minidb/cancellation/index.html"],
]
[concept.languages]
rust = "[`Receiver::recv_timeout`](https://doc.rust-lang.org/std/sync/mpsc/struct.Receiver.html#method.recv_timeout) on a channel; tokio's [`time::timeout`](https://docs.rs/tokio/latest/tokio/time/fn.timeout.html) requires a future to complete before a duration has elapsed"
