elixir_erlang = "an `after` clause on `receive`, in [Erlang](https://www.erlang.org/doc/system/expressions.html) and [Elixir](https://hexdocs.pm/elixir/processes.html)"
haskell = "[`System.Timeout.timeout`](https://hackage.haskell.org/package/base/docs/System-Timeout.html)"

