[[concept]]
slug = "daemon_thread"
title = "Daemon and detached threads"
summary = "A thread that does not keep its program alive: when the program ends, the thread is stopped wherever it happens to be."
aliases = ["daemon thread", "detached thread", "background thread"]
chapter = 1
is_a = ["thread"]
related = ["join"]
lessons = ["01_Threads/who_waits_when_main_returns"]
pages = [["Go: `main` does not wait", "https://masiarek.github.io/go-learning-library/01_Goroutines/main_does_not_wait/index.html"]]
[concept.languages]
rust = "Dropping a [`JoinHandle`](https://doc.rust-lang.org/std/thread/struct.JoinHandle.html) detaches its thread, and [every thread ends when `main` does](https://doc.rust-lang.org/std/thread/index.html#the-threading-model)"
go = "Every goroutine behaves this way: [when `main` returns the program exits](https://go.dev/ref/spec#Program_execution), without waiting for other goroutines"
c = "[`pthread_detach`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_detach.html) means nobody will join the thread; after [`pthread_exit`](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_exit.html) the process exits with status 0 once the last thread has ended"
cpp = "[`std::thread::detach`](https://en.cppreference.com/w/cpp/thread/thread/detach) lets the thread run on after its `std::thread` object is gone"
java = "[`Thread.setDaemon`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#setDaemon%28boolean%29); the JVM does not wait for daemon threads, and virtual threads are always daemons"
python = "[`daemon=True`](https://docs.python.org/3/library/threading.html#threading.Thread.daemon); the interpreter waits for non-daemon threads, and daemon threads are stopped abruptly at shutdown"
csharp = "[`Thread.IsBackground`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.thread.isbackground): background threads do not keep a process running"
haskell = "Every [`forkIO`](https://hackage.haskell.org/package/base/docs/Control-Concurrent.html#v:forkIO) thread is daemonic: the program ends when the main thread does, and waiting for the others is written by hand, for instance with an `MVar`"

[[concept]]
slug = "green_thread"
title = "Green threads and M:N scheduling"
summary = "Threads implemented by a language runtime instead of the operating system, many of them multiplexed onto a smaller number of OS threads."
aliases = ["user-space threads", "M:N threading", "lightweight threads"]
is_a = ["thread"]
related = ["fiber", "coroutine", "scheduler"]
pages = [["Go: Goroutines are cheap", "https://masiarek.github.io/go-learning-library/01_Goroutines/goroutines_are_cheap/index.html"]]
reference = [["Wikipedia: Green thread", "https://en.wikipedia.org/wiki/Green_thread"]]
[concept.languages]
rust = "Standard threads are [native OS threads](https://doc.rust-lang.org/std/thread/index.html); M:N scheduling of tasks comes from an async runtime such as [Tokio's](https://docs.rs/tokio/latest/tokio/runtime/index.html)"
go = "Goroutines are M:N: [multiplexed onto a set of OS threads](https://go.dev/doc/faq#goroutines)"
java = "[Virtual threads](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/Thread.html#virtual-threads) (JDK 21) are scheduled by the Java runtime rather than the operating system"
kotlin = "Coroutines are sent to threads by [dispatchers](https://kotlinlang.org/docs/coroutine-context-and-dispatchers.html)"
elixir_erlang = "Processes are M:N, run by [scheduler threads](https://www.erlang.org/doc/apps/erts/erl_cmd.html) inside the VM"
haskell = "[`forkIO`](https://hackage.haskell.org/package/base/docs/Control-Concurrent.html#v:forkIO) threads are lightweight, scheduled by the GHC runtime rather than the OS"

[[concept]]
slug = "goroutine"
title = "Goroutine"
summary = "Go's unit of concurrency: a function call started with the `go` statement and scheduled by the Go runtime onto a small pool of operating-system threads."
