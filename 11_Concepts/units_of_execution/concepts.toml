[[concept]]
slug = "ui_thread"
title = "UI thread"
summary = "The one thread a graphical toolkit allows to touch its widgets: long work goes to other threads or tasks, and its results are posted back to that thread."
aliases = ["main thread", "event dispatch thread", "GUI thread"]
chapter = 6
is_a = ["thread"]
related = ["thread_confinement", "blocking_the_event_loop", "event_loop"]
[concept.languages]
java = "Swing's event dispatch thread: [`SwingUtilities.invokeLater`](https://docs.oracle.com/en/java/javase/25/docs/api/java.desktop/javax/swing/SwingUtilities.html) runs code on it"
csharp = "[`Control.Invoke`](https://learn.microsoft.com/en-us/dotnet/api/system.windows.forms.control.invoke) runs a delegate on the thread that owns a Windows Forms control"
swift = "[`MainActor`](https://developer.apple.com/documentation/swift/mainactor), the global actor that performs its tasks on the main thread"
javascript = "the [main thread](https://developer.mozilla.org/en-US/docs/Glossary/Main_thread), where the browser runs user code, handles events and renders; web workers run elsewhere"
