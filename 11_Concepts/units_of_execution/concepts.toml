  ["exit - function - rust - std::process::exit", "https://docs.google.com/document/u/0/d/1k-s4WLlQ4f3M7leYOgCHCere0fxavnIxwWYPddMxsQg/edit"],
  ["how the CPU interacts with processes and threads", "https://docs.google.com/document/u/0/d/1l0y3Zy3fKsIhcYkWkeqiitgQEP-uMEyceIWqsZoRkig/edit"],
