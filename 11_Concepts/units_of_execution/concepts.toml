  ["Go: `main` does not wait", "https://masiarek.github.io/go-learning-library/01_Goroutines/main_does_not_wait/index.html"],
  ["Go: A goroutine has no handle", "https://masiarek.github.io/go-learning-library/01_Goroutines/a_goroutine_has_no_handle/index.html"],
  ["Go: A panic ends the whole program", "https://masiarek.github.io/go-learning-library/01_Goroutines/a_panic_ends_the_whole_program/index.html"],
  ["Go: Goroutines are cheap", "https://masiarek.github.io/go-learning-library/01_Goroutines/goroutines_are_cheap/index.html"],
]
