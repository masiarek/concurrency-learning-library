[category]
title = "Safety in languages"
order = 10
blurb = "How languages and libraries promise that code is safe to share — thread safety, reentrancy, ownership, immutability — and the formal conditions that say what correct means."

[[concept]]
slug = "thread_safety"
title = "Thread safety"
summary = "Code or data is thread-safe if it behaves correctly when used from several threads at once, without its callers adding any synchronization."
aliases = ["thread-safe", "MT-safe"]
chapter = 2
related = ["reentrancy"]
notes = [["threads - general - thread safety", "https://docs.google.com/document/d/1cOzooElU4zoopDmG959t42v0O--IXdGOWIPWtVmJ0ag/edit?tab=t.0"]]
pages = [["Python: The format mini-language — a formatting call that changes process-wide state", "https://masiarek.github.io/python-learning-library/01_Text_and_Bytes/the_format_mini_language/index.html"]]
reference = [["Wikipedia: Thread safety", "https://en.wikipedia.org/wiki/Thread_safety"]]
[concept.languages]
rust = "Checked by the compiler through [`Send`](https://doc.rust-lang.org/std/marker/trait.Send.html) and [`Sync`](https://doc.rust-lang.org/std/marker/trait.Sync.html): a type is `Sync` if and only if `&T` is `Send`"
go = "Documented type by type: [`sync.Map`](https://pkg.go.dev/sync#Map) is safe for concurrent use without extra locking, [built-in maps are not](https://go.dev/doc/faq#atomic_maps)"
cpp = "[Containers](https://en.cppreference.com/w/cpp/container): different containers may be used from different threads, and `const` member functions on the same container concurrently"
java = "[`ArrayList`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/util/ArrayList.html) is not synchronized and suggests wrapping it with `Collections.synchronizedList` at creation"
python = "[Thread Safety Guarantees](https://docs.python.org/3/library/threadsafety.html) grades built-in types from incompatible through safe on shared objects to atomic"
csharp = "The [`System.Collections.Concurrent`](https://learn.microsoft.com/en-us/dotnet/standard/collections/thread-safe/) collections are thread-safe and scalable"
swift = "[`Sendable`](https://developer.apple.com/documentation/swift/sendable): a thread-safe type whose values can be shared across concurrent contexts without risk of data races"
os = "[POSIX §2.9.1](https://pubs.opengroup.org/onlinepubs/9799919799/functions/V2_chap02.html#tag_16_09_01): every function is thread-safe except a listed set, such as `strtok` and `asctime`"

[[concept]]
slug = "reentrancy"
title = "Reentrancy"
summary = "A function is reentrant if it can be entered again — by another thread, a signal handler, or itself — before an earlier call has finished, usually because it keeps its state in structures the caller owns instead of in statics."
aliases = ["reentrant function", "async-signal-safe"]
reference = [["Wikipedia: Reentrancy (computing)", "https://en.wikipedia.org/wiki/Reentrancy_(computing)"]]
[concept.languages]
python = "[`signal`](https://docs.python.org/3/library/signal.html): a Python handler does not run inside the low-level C signal handler, which only sets a flag for the interpreter"
os = "[signal-safety(7)](https://man7.org/linux/man-pages/man7/signal-safety.7.html): an async-signal-safe function is one that can be safely called from within a signal handler"

[[concept]]
slug = "send_and_sync"
title = "Send and Sync"
summary = "Rust's two marker traits: a `Send` value may move to another thread, a `Sync` value may be shared with one by reference, and the compiler checks both."
aliases = ["Sendable"]
chapter = 2
prevents = ["data_race"]
pages = [
  ["Rust: Send and Sync", "https://masiarek.github.io/rust-learning-library/09_Advanced/send_and_sync/index.html"],
  ["Rust: Sharing across threads: Arc", "https://masiarek.github.io/rust-learning-library/18_Ownership/sharing_across_threads/index.html"],
]
reference = [["The Rustonomicon: Send and Sync", "https://doc.rust-lang.org/nomicon/send-and-sync.html"]]
[concept.languages]
rust = "[`Send`](https://doc.rust-lang.org/std/marker/trait.Send.html) and [`Sync`](https://doc.rust-lang.org/std/marker/trait.Sync.html) are `unsafe` auto traits; `Rc` is not `Send` because its reference count is not atomic, while `Arc` is"
swift = "[`Sendable`](https://developer.apple.com/documentation/swift/sendable) plays the same part: a type whose values can cross concurrent contexts without risk of data races"

[[concept]]
slug = "data_race_freedom"
title = "Data-race freedom by construction"
summary = "A language rule that makes data races impossible to write in the first place — Rust's ownership with Send and Sync, or actors that never share memory."
chapter = 2
lessons = ["02_Shared_State/the_lost_update"]
prevents = ["data_race"]
uses = ["send_and_sync"]
notes = [["data race freedom (DRF)", "https://docs.google.com/document/d/1IhgEtE6x4eeA-a0M4PdTGgW8ekLEoTPANFqNtbZDqPU/edit?tab=t.0"]]
[concept.languages]
rust = "[The Rustonomicon](https://doc.rust-lang.org/nomicon/races.html): safe Rust guarantees an absence of data races, though not of race conditions"
go = "A convention, not a rule: [Effective Go](https://go.dev/doc/effective_go#sharing) says share memory by communicating, so only one goroutine has access to a value at a time"
swift = "The [Swift 6 language mode](https://www.swift.org/migration/documentation/swift-6-concurrency-migration-guide/dataracesafety/) prevents data races at compile time"
javascript = "[Web workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API) exchange messages whose data is copied rather than shared"
elixir_erlang = "[All data in messages between processes is copied](https://www.erlang.org/doc/system/eff_guide_processes.html), except refc binaries and literals"

[[concept]]
slug = "immutability"
title = "Immutability"
summary = "Data that cannot change after it is built can be shared by any number of threads with no synchronization at all."
aliases = ["immutable object", "persistent data structure"]
prevents = ["data_race"]
reference = [["Wikipedia: Immutable object", "https://en.wikipedia.org/wiki/Immutable_object"]]
[concept.languages]
rust = "The default: [shared references disallow mutation](https://doc.rust-lang.org/std/sync/struct.Arc.html), so data behind an `Arc` changes only through a `Mutex`, `RwLock` or atomic inside it"
go = "[Strings are immutable](https://go.dev/ref/spec#String_types): once created, a string's contents cannot change"
cpp = "A [`const` object](https://en.cppreference.com/w/cpp/language/cv) cannot be modified, except for its `mutable` members"
java = "[JLS §17.5 `final` field semantics](https://docs.oracle.com/javase/specs/jls/se25/html/jls-17.html#jls-17.5) keep objects such as `String` immutable even when references to them cross threads through data races"
python = "[Frozen dataclasses](https://docs.python.org/3/library/dataclasses.html#frozen-instances) raise `FrozenInstanceError` on assignment"
csharp = "[`System.Collections.Immutable`](https://learn.microsoft.com/en-us/dotnet/api/system.collections.immutable) collections cannot be changed once created"
javascript = "[`Object.freeze`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze) is shallow: objects nested in a frozen object can still change"

[[concept]]
slug = "interior_mutability"
title = "Interior mutability"
summary = "Changing data behind a shared reference through a type that enforces the rules itself — `Cell` and `RefCell` within one thread, `Mutex` and atomics across threads."
uses = ["mutex", "atomic_variable"]
pages = [["Rust: Interior mutability", "https://masiarek.github.io/rust-learning-library/09_Advanced/interior_mutability/index.html"]]
notes = [["interior mutability - rust", "https://docs.google.com/document/d/1ECvShX0c8HmryPbay3G_MI_Qq6sfXEW2OQ_K4RMb2lM/edit?tab=t.0"]]
reference = [["The Rust Reference: Interior mutability", "https://doc.rust-lang.org/reference/interior-mutability.html"]]
[concept.languages]
rust = "[`std::cell`](https://doc.rust-lang.org/std/cell/index.html): `Cell`, `RefCell` and `OnceCell` are single-threaded and not `Sync`; across threads use `Mutex`, `RwLock` or atomics"
cpp = "The [`mutable`](https://en.cppreference.com/w/cpp/language/cv) specifier lets a member change inside a `const` object — typically a mutex, as in the page's rule that mutable and mutex go together"

[[concept]]
slug = "thread_confinement"
title = "Thread confinement"
summary = "Keeping a piece of data reachable from one thread only — a GUI's main thread, a goroutine that owns its state — so that it needs no synchronization."
aliases = ["ownership by one thread", "confinement", "thread-local storage"]
prevents = ["data_race"]
related = ["message_passing"]
[concept.languages]
rust = "Enforced for some types: [`Rc`](https://doc.rust-lang.org/std/rc/struct.Rc.html) is not `Send`, so it cannot leave its thread; [`thread_local!`](https://doc.rust-lang.org/std/macro.thread_local.html) declares per-thread statics"
go = "By convention: [Effective Go](https://go.dev/doc/effective_go#sharing) passes values on channels so that only one goroutine has access at any given time"
c = "[`_Thread_local`](https://en.cppreference.com/w/c/language/storage_duration) (C11), spelled `thread_local` since C23"
java = "[`ThreadLocal`](https://docs.oracle.com/en/java/javase/25/docs/api/java.base/java/lang/ThreadLocal.html): each thread has its own, independently initialized copy"
python = "[`threading.local`](https://docs.python.org/3/library/threading.html#thread-local-data) holds data whose values are thread specific"
csharp = "[`ThreadLocal<T>`](https://learn.microsoft.com/en-us/dotnet/api/system.threading.threadlocal-1) provides thread-local storage of data"
javascript = "[Web workers](https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API) receive copies of message data, not the sender's objects"

[[concept]]
slug = "linearizability"
title = "Linearizability"
summary = "A concurrent object is linearizable if every operation appears to take effect at a single instant between its start and its end, so it can be reasoned about as if it were sequential."
aliases = ["atomic consistency", "strong consistency"]
contrasts = ["sequential_consistency"]
reference = [["Wikipedia: Linearizability", "https://en.wikipedia.org/wiki/Linearizability"]]
[concept.languages]
kotlin = "[Lincheck](https://github.com/JetBrains/lincheck) runs random concurrent scenarios by stress testing or bounded model checking and checks that the results are linearizable"

[[concept]]
slug = "sequential_consistency"
title = "Sequential consistency"
summary = "Operations appear to happen in some single order that respects each task's own order, though not necessarily real time — weaker than linearizability."
aliases = ["SeqCst"]
notes = [["sequential consistency", "https://docs.google.com/document/d/1QQTW1NbrHYrrjaSAvPRkIFAJyq_VPOSrB0eS4duX4pc/edit?tab=t.0"]]
reference = [["Wikipedia: Sequential consistency", "https://en.wikipedia.org/wiki/Sequential_consistency"]]
[concept.languages]
rust = "[`Ordering::SeqCst`](https://doc.rust-lang.org/std/sync/atomic/enum.Ordering.html#variant.SeqCst) additionally preserves a total order of such operations across all threads"
c = "The generic [`atomic_compare_exchange`](https://en.cppreference.com/w/c/atomic/atomic_compare_exchange) functions use `memory_order_seq_cst` by default"
cpp = "[`std::memory_order_seq_cst`](https://en.cppreference.com/w/cpp/atomic/memory_order): the default for all atomic operations, sequentially consistent ordering"

[[concept]]
slug = "object_lifetime"
title = "Object lifetime"
summary = "The span in which a value's storage is valid, and the question of who guarantees that every reference to it is dropped first — the compiler, the programmer, or a garbage collector."
aliases = ["lifetime", "storage duration", "extent"]
chapter = 1
related = ["escape_analysis", "thread_confinement"]
lessons = ["01_Threads/lending_a_local_to_a_thread"]
reference = [["Wikipedia: Object lifetime", "https://en.wikipedia.org/wiki/Object_lifetime"]]
[concept.languages]
rust = "[Lifetimes](https://doc.rust-lang.org/book/ch10-03-lifetime-syntax.html) are part of a reference's type, and `'static` means the reference may outlive any caller"
go = "Decided by the compiler: the [FAQ](https://go.dev/doc/faq#stack_or_heap) says a local whose address escapes is allocated on the heap, and the collector frees it"
c = "[Lifetime](https://en.cppreference.com/w/c/language/lifetime): an automatic object's lifetime ends when its block does, and a pointer to it is then indeterminate"
cpp = "[Lifetime](https://en.cppreference.com/w/cpp/language/lifetime), and [storage duration](https://en.cppreference.com/w/cpp/language/storage_duration) for where it comes from"
java = "Decided by reachability: [JLS 12.6](https://docs.oracle.com/javase/specs/jls/se25/html/jls-12.html#jls-12.6) says an object is finalizable once it is no longer reachable"
python = "[Reference counting and the cyclic collector](https://docs.python.org/3/library/gc.html); [`weakref`](https://docs.python.org/3/library/weakref.html) holds a reference that does not keep the object alive"

[[concept]]
slug = "escape_analysis"
title = "Escape analysis"
summary = "The compiler deciding whether a local's address can outlive its frame, and moving the local to the heap when it can — which is how a language with a garbage collector lets a thread capture a local safely."
aliases = ["escapes to heap", "moved to heap"]
chapter = 1
prevents = ["dangling_pointer"]
related = ["object_lifetime"]
lessons = ["01_Threads/lending_a_local_to_a_thread"]
reference = [["Wikipedia: Escape analysis", "https://en.wikipedia.org/wiki/Escape_analysis"]]
[concept.languages]
go = "[`go build -gcflags=-m`](https://pkg.go.dev/cmd/compile) reports each decision, including `moved to heap`; the [FAQ](https://go.dev/doc/faq#stack_or_heap) states the rule"
java = "HotSpot may allocate a non-escaping object on the stack or split it into fields; [JEP 8221340](https://bugs.openjdk.org/browse/JDK-8221340) tracks the analysis"
rust = "None is needed for safety: a reference that would outlive its referent is a compile error instead, so the placement is the programmer's choice"
